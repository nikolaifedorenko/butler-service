# Reverse-proxy для docker-compose.prod.yml: TLS, лимиты,gzip, проксирование.
# Подключается как /etc/nginx/conf.d/default.conf (см. volumes в compose).
# Сертификаты: положите fullchain.pem и privkey.pem в ./certs рядом с compose
# (Let's Encrypt: certbot certonly --webroot … или docker-образ certbot).

# HTTP: только проверка домена для ACME, остальное — редирект на HTTPS
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # видео обхода — до 50 МБ (лимит объекта по умолчанию, app/core/media.py) + запас на
    # multipart; поднимая video_max_mb в настройках, поднимите и это значение
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # метрики — только из внутренней сети (скрейпер Prometheus на том же хосте);
    # публично не отдаём
    location = /metrics {
        deny all;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        # PDF через LibreOffice может считаться до 180 с (app/pdf_render.py) —
        # не обрываем такие запросы раньше приложения
        proxy_read_timeout    200s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
    }
}
