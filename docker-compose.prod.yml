# Прод-профиль: nginx (TLS) + PostgreSQL + приложение (несколько воркеров) + бэкапы.
#
# Подготовка (один раз):
#   1. .env рядом с этим файлом:
#        SECRET_KEY=$(openssl rand -hex 32)     # обязателен — без него приложение не стартует
#        POSTGRES_PASSWORD=<надёжный пароль>
#   2. сертификаты: ./certs/fullchain.pem и ./certs/privkey.pem (Let's Encrypt).
#      Для первого выпуска сертификата можно временно оставить только сервер :80
#      (location /.well-known/acme-challenge/ в deploy/nginx.conf уже настроен).
#
# Запуск:   docker compose -f docker-compose.prod.yml up -d --build
# Логи:     docker compose -f docker-compose.prod.yml logs -f app
# Бэкапы:   ./backups/timetrack-<дата>.sql.gz (ежесуточно, хранение 14 шт.)
# Подробно: deploy/README.md

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timetrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-timetrack}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timetrack} -d ${POSTGRES_DB:-timetrack}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-timetrack}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-timetrack}
      SECRET_KEY: ${SECRET_KEY:?задайте SECRET_KEY в .env (openssl rand -hex 32)}
      APP_TZ: ${APP_TZ:-Europe/Moscow}
      TZ: ${APP_TZ:-Europe/Moscow}
      # боевые нормы: cookie только по TLS, демо-вход выключен, IP из XFF
      # (приложение стоит за своим nginx), JSON-лог, метрики для внутреннего скрейпера
      COOKIE_SECURE: "1"
      ALLOW_IMPERSONATION: "0"
      TRUST_PROXY_HEADERS: "1"
      LOG_JSON: "1"
      METRICS_ENABLED: ${METRICS_ENABLED:-1}
      CSRF_ENABLED: "1"
    # несколько воркеров допустимы: замок отметок — строка БД (SELECT … FOR UPDATE),
    # rate-limit входа per-worker (при жёстких требованиях — вынести в Redis, ADR-0005)
    command: >
      python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
      --workers ${UVICORN_WORKERS:-2} --proxy-headers --forwarded-allow-ips "*"
      --no-access-log
    volumes:
      - app_data:/srv/timetrack/data
      - app_templates:/srv/timetrack/templates
    # наружу не публикуется — доступ только через nginx
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-www:/var/www/certbot:ro

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-timetrack}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /backups
        while true; do
          f=/backups/timetrack-$$(date +%F-%H%M%S).sql.gz
          if pg_dumpall --clean --if-exists | gzip > "$$f"; then
            echo "backup ok: $$f"
          else
            echo "backup FAILED" >&2
            rm -f "$$f"
          fi
          ls -1t /backups/timetrack-*.sql.gz 2>/dev/null | tail -n +$$(( $${BACKUP_KEEP:-14} + 1 )) | xargs -r rm --
          sleep $${BACKUP_INTERVAL:-86400}
        done

volumes:
  pg_data:
  app_data:
  app_templates:
