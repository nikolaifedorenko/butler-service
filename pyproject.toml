# Зависимости и конфигурация инструментов. Пакетом проект не публикуется; окружение
# собирает uv по uv.lock: `uv sync` (с dev-группой) или `uv sync --no-dev` (как в образе).
[project]
name = "butler-service"
version = "0.1.0"
description = "Батлер Сервис: рабочее место батлерской службы"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.159.1",
    "uvicorn[standard]>=0.30",
    "SQLAlchemy>=2.0",
    "alembic>=1.20.1",             # миграции схемы: ревизии в app/bootstrap/alembic/versions
    "psycopg2-binary>=2.9.13",     # драйвер PostgreSQL
    "pydantic>=2.7",
    "pydantic-settings>=2.3",      # .env; сам тянет python-dotenv
    "python-multipart>=0.0.9",
    # транспорт Telegram Bot API (notify/adapters/transports/telegram.py): доставка и каталог
    # чатов выходят в сеть из процесса приложения, поэтому зависимость обязательная, а не dev
    "httpx>=0.27",
    # файлы — только модуль exchange: XLSX, DOCX, PDF и картинки в документах
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "pillow>=10.0",
    # шифрование секретов уведомлений в БД (Fernet) ключом NOTIFY_SECRET_KEY —
    # notify/application/secrets.py
    "cryptography>=44",
    "prometheus-client>=0.20",     # метрики /metrics при METRICS_ENABLED=1
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",             # покрытие: приложение ≥ 90 %, ядро расчёта ≥ 95 %
    "httpx2>=2.13",                # новые версии starlette требуют его для TestClient
    "pypdf>=4.0",                  # проверка содержимого PDF в тестах
    "freezegun>=1.4",              # фиксация времени: границы полуночи и ночной смены
    "hypothesis>=6.100",           # property-based тесты инвариантов движка
    "import-linter>=2.0",          # контракты импортов (.importlinter)
    "mypy>=1.11",                  # типы ядра расчёта ([tool.mypy])
    "ruff>=0.17",
    "pytest-xdist>=3.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 118
target-version = "py315"
# tools/ — dev-скрипты (харнесы смоуков/сценариев, генераторы, утилиты):
# линтеру там нечего делать, а шум мешает видеть проблемы в app/ и tests/.
extend-exclude = ["tools/"]

[tool.ruff.lint]
# E/W — pycodestyle, F — pyflakes, I — сортировка импортов, B — багберы,
# UP — устаревшие конструкции, SIM — упрощения, RET — возвраты, RUF — прочее
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RET"]
ignore = [
    "E501",   # длина строки: много русских строк и docstring'ов
    "E702",   # однострочники через «;» — компактная стилизация ячеек в XLSX/DOCX
    "E731",   # lambda в переменной: в генераторах отчётов это короче def
    "SIM102", # вложенные if часто читаемее (разные ветки бизнес-правил)
    "B008",   # Depends() в аргументах по умолчанию — идиома FastAPI
    "B904",   # raise ... from e: массовое изменение обработчиков ошибок не в этом батче
    "SIM108", # тернарник не всегда читаемее if/else
    "RET504", # «лишнее» присваивание перед return часто намеренное
    "UP006",  # Optional[...] → [... | None]: проект сознательно на typing.Optional
    "UP035",  # то же: импорт Optional из typing не считаем устаревшим
    "UP045",  # то же
]

[tool.ruff.lint.per-file-ignores]
# B011 — assert False в тестах намеренно; F811 — фикстуры, импортированные из
# соседнего тестового модуля, pytest подставляет как параметры функций, а линтер
# видит «переопределение имени» (tests/test_night_export_v2.py берёт транспортные
# заглушки из tests/test_night_dispatch.py, чтобы не дублировать их).
"tests/*" = ["B011", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
# проверка типов (решение владельца 25.10.2026): сначала ядро расчёта — чистый домен без
# фреймворков, где ошибка типа = ошибка в деньгах сотрудников. Расширять — по слоям.
python_version = "3.15"
files = ["app/modules/timesheet/domain"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = false
strict_equality = true

[tool.coverage.run]
source = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# параллельно, у каждого потока своя база PostgreSQL (tests/conftest.py); тесты одного файла —
# в одном потоке по порядку. Один поток: -n 0
addopts = "-n auto --dist loadfile"
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]
