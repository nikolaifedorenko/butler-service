name: CI

# Минимальный CI: линтер, тесты, смоук интерфейса, сверка контракта фронт↔бэк,
# согласованность версий статики и лок-файла, сборка Docker-образа.
#
# Почему это важно именно здесь: в проекте долгое время не было ни git-истории,
# ни проверок — регрессия (отсутствующие loadNight/loadCars) уехала в main и
# оставила интерфейс пустым. Все проверки ниже ловят такой класс ошибок.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: "Python 3.15 + PostgreSQL 18: ruff + pytest"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # сервер PostgreSQL для тестов и сценариев; базы создаются сами (tests/conftest.py,
      # tools/scenario_db.py)
      TEST_DATABASE_SERVER: postgresql+psycopg2://postgres:ci@localhost:5432
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Зависимости
        # ставим ТОЧНО из uv.lock: версии и хеши пакетов (воспроизводимость)
        run: |
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Линтер (ruff)
        run: python -m ruff check .

      - name: Контракты импортов (import-linter, .importlinter)
        run: lint-imports

      - name: Тесты + порог покрытия (приложение ≥ 90 %, ядро расчёта ≥ 95 %)
        # с 25.10.2026 порог блокирующий: DoD спецификации — ядро ≥ 95 % (сейчас 98 %),
        # приложение — не ниже 90 % (сейчас 91 %)
        # тесты идут параллельно, у каждого потока своя база (pyproject.toml: -n auto)
        run: |
          python -m pytest tests/ -q --cov=app --cov-report=
          python -m coverage report --skip-covered --skip-empty --fail-under=90 | tail -3
          python -m coverage report --include='app/modules/timesheet/domain/*' --fail-under=95 | tail -1

      - name: Типы ядра расчёта (mypy, [tool.mypy] в pyproject.toml)
        run: python -m mypy

      - name: Версии статики согласованы (index.html ↔ sw.js)
        run: python tools/bump_version.py --check

      - name: Контракт фронтенд ↔ API
        run: python tools/check_api_contract.py

      - name: Контракты импортов согласованы со списком модулей (.importlinter)
        run: python tools/gen_importlinter.py --check

      - name: В живых документах нет битых ссылок
        run: python tools/doc_links.py

      - name: Лок-файл зависимостей не разошёлся с pyproject.toml
        run: uv lock --check

      - name: Контракт OpenAPI не разошёлся с кодом (docs/openapi.json)
        run: python tools/export_openapi.py --check

      - name: Аудит зависимостей (pip-audit, известные CVE)
        # блокирующий с 22.10.2026: новая CVE в зависимостях проекта остановит merge.
        # Проверяем lock-файл (то, что ставится в Docker-образ и в окружение разработки),
        # а не окружение раннера
        run: |
          uv export --frozen --no-hashes -o "$RUNNER_TEMP/requirements.txt" > /dev/null
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --desc

      - name: Самодиагностика схемы (/api/selfcheck)
        run: |
          DATABASE_URL="$(python tools/scenario_db.py selfcheck)" SECRET_KEY="ci-only-not-a-secret" DEMO_SEED=1 \
          python -c "
          from fastapi.testclient import TestClient
          from app.main import app, init_db, schema_report
          init_db()
          # без входа эндпоинт отдаёт только ok — проверяем его, а детали берём напрямую
          assert TestClient(app).get('/api/selfcheck').json()['ok']
          data = schema_report()
          assert data['ok'], data['missing']
          print('selfcheck ok:', data['tables_found'], 'таблиц из', data['tables_expected'])
          "

  frontend:
    name: "JavaScript: синтаксис + смоук интерфейса"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # сервер PostgreSQL для тестов и сценариев; базы создаются сами (tests/conftest.py,
      # tools/scenario_db.py)
      TEST_DATABASE_SERVER: postgresql+psycopg2://postgres:ci@localhost:5432
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # jsdom 30+ (undici 7) требует Node ≥22: на 20 харнес падал с
          # «webidl.util.markAsUncloneable is not a function» (дефект 15.10.2026)
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Синтаксис всех скриптов интерфейса
        # find, а не `static/js/*.js`: разделы переехали в static/js/modules/
        # (фаза C6), и нераскрывающийся глоб оставлял их без проверки синтаксиса
        # (находка ревью 20.10.2026, P1-frontend). eslint ниже и так ходит по
        # каталогу рекурсивно — здесь закрываем именно node --check.
        run: |
          for f in $(find static/js static/sw.js -name '*.js' | sort); do
            echo "node --check $f"; node --check "$f";
          done

      - name: Зависимости (python + jsdom + eslint)
        run: |
          uv sync --frozen --no-dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          npm install --no-audit --no-fund

      - name: Аудит npm-зависимостей (известные CVE)
        # блокирующий с 22.10.2026: находок нет — новая CVE остановит merge
        run: npm audit --audit-level=high

      - name: Линтер JavaScript (no-undef ловит отсутствующие функции разделов)
        run: npx eslint --max-warnings=0 static/js static/sw.js

      - name: Список глобальных имён JS не разошёлся с кодом
        run: python tools/gen_js_globals.py --check

      - name: Смоук интерфейса (все разделы, три роли)
        # admin добавлен вместе с новым разделом «Настройки»: смоук обходит ВСЕ его
        # под-экраны (обзор, расчёт, правила оплаты, коды и окна, группы, календарь,
        # смены, документы, система, режим эксперта) — под ролью с правом settings.edit,
        # чтобы проверялись и кнопки правки, а не только чтение.
        run: |
          ./tools/run_ui_check.sh 8199 gromova
          ./tools/run_ui_check.sh 8198 ivanov
          ./tools/run_ui_check.sh 8197 admin
          ./tools/run_ui_check.sh 8190 rukovod stays
          ./tools/run_ui_check.sh 8189 sluzhba stays

      - name: Сценарий раздела «Настройки» (клики, мастер, проверитель, публикация версии)
        # Смоук проверяет, что экраны ОТРИСОВАНЫ; этот сценарий — что они РАБОТАЮ:
        # переопределение правила сохраняется, «Проверитель» объясняет значение,
        # значение Табеля добавляется формой и публикуется версией, черновик
        # показывает diff и сбрасывается. Именно на действиях ломался старый раздел
        # (конфликт правил сохранялся и ронял вкладки в 500 — дефекты D8/D9).
        run: ./tools/run_settings_scenario.sh 8196 admin

      - name: "Сценарий норматива 12.10.2026 (Табель/График: T1+T3+T4)"
        # Пользовательские пути батча T1+T3+T4 из docs/REVIEW-GRAFIK-4-SLOYA-2026-10-12.md:
        # «код в табеле» у смены — только выбор из справочника (T1), «Сбросить» возвращает
        # автозаполнение из циклов (T3), «отпросился (выходной за часы)» — одна сущность
        # с двумя точками ввода, а заявления печатаются из своего слоя (T4/Q4).
        run: ./tools/run_norms_scenario.sh 8195 admin

      - name: "Сценарий «График = 4 слоя» (T5: один пункт меню, слои 0–3, сетка «Номера»)"
        # Пользовательские пути T5 (docs/REVIEW-GRAFIK-4-SLOYA-2026-10-12.md, §9):
        # «График» — один пункт меню со слоями 0 Табель · 1 План/График · 2 Факт ·
        # 3 Управленческий Табель (Q2); доска «Отметки» — отдельный пункт (Q7);
        # в слое 2 сетка «Номера» (/api/fact/day) — отметки СКУД, округление до шага
        # из настроек, окно из кода Табеля, план/отработано/недостача/переработка,
        # флаги; слои фильтруются по правам роли, алиасы старых разделов работают.
        run: ./tools/run_layers_scenario.sh 8194 admin

      - name: "Сценарий обхода электрокаров (окно отметки = окно возврата кара)"
        # Окно ночной отметки кара приведено к окну возврата («Электрокары» → «Вернул»):
        # чекбокс «Кар найден на месте», место — списком из справочника, те же чекбоксы
        # состояния и фото (камера/галерея). Сценарий СВЕРЯЕТ два окна между собой,
        # проходит путь батлера до сохранения отметки с фото (multipart) и проверяет,
        # что карточка кара обновилась, а снимок отдаётся. Отчёт смены создаётся
        # в обёртке: днём ensure_report() ждёт 20:00, а CI запускается в любое время.
        run: ./tools/run_night_cars_scenario.sh 8193 gromova

      - name: "Сценарий ночного обхода v2 (зоны → объекты → чек-листы)"
        # Трёхуровневая навигация ночного отчёта: чек-лист задаётся НА ЗОНУ, поэтому
        # у десятков однотипных объектов он одинаковый; индивидуальные особенности
        # объекта (своя формулировка, отключённый пункт, свой пункт) правятся точечно.
        # Сценарий проходит путь батлера (зоны → объекты → отметки → завершение) и
        # проверяет, что справочники реально влияют на обход: новый пункт шаблона зоны
        # попадает во все её объекты, правка — только в один, начатые смены не перекраиваются.
        # Часовой пояс объекта подбирается так, чтобы «сейчас» была середина ночной
        # смены (20:00–08:00) — иначе днём отчёт закрыт и сценарий не запустить.
        # Запускаем под admin: сценарий покрывает и обход, и справочники, и общие
        # настройки доставки «Чаты и Почта» (право settings.edit), и экран
        # «Недостатки смены». Под другой ролью он тоже проходит — блок общих
        # настроек заменяется проверкой, что экран без settings.edit скрыт.
        run: ./tools/run_night_zones_scenario.sh 8192 admin

      - name: "Сценарий «Шахматки» (бронь с предпросмотром, батлеры, табло; роли)"
        # Под admin — путь менеджера: бронь формой с предпросмотром, вытеснение чужой
        # брони, 409 при устаревшей версии, «Перенести», назначение шаблоном, «вне смены» →
        # «Добавить смену в График», табло дня, ручная правка по дням, загрузка и полный
        # фонд на 440 объектах. Под ivanov — «Мои гости» и правка своей брони; под sluzhba —
        # вкладки без единой фамилии гостя; rukovod — просмотр без правки.
        run: |
          ./tools/run_stays_scenario.sh 8188 admin
          ./tools/run_stays_scenario.sh 8187 ivanov
          ./tools/run_stays_scenario.sh 8186 sluzhba
          ./tools/run_stays_scenario.sh 8185 rukovod

      - name: "Сценарий экрана «Фонд» шахматки (черновик с даты, деление, флаги, перевод броней, публикация)"
        # Под admin — путь менеджера: черновик с завтра, деление коннекта 12134, 409 при
        # устаревшем rev, массовая отметка флага по узлу, предпросмотр с переводом брони
        # без объекта и публикация; гонка переключения версий. Под rukovod — экрана нет.
        run: |
          ./tools/run_stays_fund_scenario.sh 8184 admin
          ./tools/run_stays_fund_scenario.sh 8183 rukovod

  docker:
    name: Docker-образ собирается
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Сборка
        run: docker build -t butler-service:ci .

      - name: Приложение импортируется в образе (без setuptools, с драйвером PostgreSQL)
        # адрес базы — заглушка: настройки требуют PostgreSQL, но импорт к базе не подключается
        run: >
          docker run --rm -e DATABASE_URL=postgresql+psycopg2://image:check@127.0.0.1:1/none
          butler-service:ci python -c "import app.main, psycopg2, cryptography; print('ok')"

      - name: Уязвимости образа (Trivy, HIGH/CRITICAL с исправлением)
        # с 25.10.2026: pip-audit смотрит только Python-пакеты, а образ — это ещё и
        # системные пакеты базового python:3.15-slim. Блокирующий для уязвимостей,
        # у которых уже есть исправленная версия; остальные — в отчёте
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: butler-service:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  secrets:
    name: Секреты в коммитах (gitleaks)
    # с 25.10.2026: токен, пароль или ключ, случайно попавший в коммит, останавливает merge.
    # Тестовые ключи и демо-данные — в .gitleaks.toml (allowlist по путям)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
