version: 2
updates:
  # Python-зависимости: PR обновляют uv.lock (и границы в pyproject.toml, если иначе нельзя)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # границы «>=» в pyproject.toml не поднимать без нужды: обновляется lock
    versioning-strategy: increase-if-necessary
    groups:
      # httpx2 требует httpcore2 ровно своей версии: по отдельности PR не ставятся
      # (дефект 25.10.2026, ResolutionImpossible) — обновляем парой
      httpx2:
        patterns: ["httpx2", "httpcore2"]

  # dev-зависимости фронтенда (jsdom/eslint для смоуков)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # базовые образы Dockerfile (python:3.15-slim) и бэкапа (deploy/backup.Dockerfile) —
  # с 25.10.2026: уязвимости системных пакетов образа закрывает обновление базы
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "weekly"
  # образы prod-compose (postgres, nginx)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"

  # версии actions (checkout/setup-python/setup-node)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
