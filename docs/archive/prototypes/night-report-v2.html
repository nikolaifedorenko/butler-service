<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ночной отчёт v2 — прототип (зоны · объекты · службы · рассылка)</title>
<style>
/* ══════════════════════════════════════════════════════════════════════
   ПРОТОТИП «Ночной отчёт v2». Дизайн-токены и компоненты взяты из
   static/css/app.css (фирменный стиль курорта «Мрия»), чтобы макет
   выглядел как продукт. Файл автономен: ни сети, ни внешних шрифтов.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#f4f0ed; --bg-soft:#faf8f5; --panel:#fff; --panel-2:#f4eeeb;
  --line:#e2d9ce; --line-soft:#ece5dc;
  --text:#141a25; --muted:#6e6459; --muted-2:#a2968a;
  --primary:#94583a; --primary-dark:#683e29; --primary-soft:#9a7060;
  --gold:#cbb05b; --gold-deep:#a8893a;
  --navy:#141a25; --navy-2:#202530;
  --accent:#3d7a52; --accent-dark:#2f6242; --danger:#b81818; --warn:#c96d00; --info:#1d7e94;
  --r-lg:10px; --r-md:6px; --r-sm:4px;
  --shadow:0 10px 28px rgba(20,26,37,.08); --shadow-lg:0 22px 60px rgba(20,26,37,.18);
  --head-h:60px; --side-w:236px;
  --font-body:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PT Sans','Noto Sans',Arial,sans-serif;
  --font-display:'Playfair Display','SangBleu Kingdom',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.hidden{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
code{background:#f4eeeb;padding:1px 6px;border-radius:4px;color:var(--primary);font-size:.92em}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d3c6b6;border-radius:8px;border:2px solid var(--bg)}

/* ── топбар ── */
.topbar{position:fixed;inset:0 0 auto 0;height:var(--head-h);z-index:50;display:flex;align-items:center;
  gap:12px;padding:0 16px;background:linear-gradient(100deg,var(--navy) 0%,var(--navy-2) 100%);color:#f3ede2;
  border-bottom:1px solid #0d121b;box-shadow:0 6px 20px rgba(20,26,37,.18)}
.topbar .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:18px;letter-spacing:.2px}
.topbar .brand small{display:block;font-family:var(--font-body);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold);font-weight:700}
.topbar .spacer{flex:1}
.topbar .shift{font-size:12.5px;color:#cfc6b8;text-align:right;line-height:1.3}
.topbar .shift b{color:#f3ede2;font-weight:700}
.user-chip{display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid rgba(203,176,91,.4);
  border-radius:var(--r-md);background:rgba(255,255,255,.05)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;
  place-items:center;font-weight:800;font-size:12px}
.user-chip .n{font-size:12.5px;font-weight:700;line-height:1.15}
.user-chip .r{font-size:10.5px;color:var(--gold);text-transform:uppercase;letter-spacing:.1em}
.proto-tag{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  background:var(--gold);color:var(--navy);padding:4px 8px;border-radius:3px}

/* ── раскладка ── */
.app{position:fixed;inset:var(--head-h) 0 0 0;display:flex}
.sidenav{width:var(--side-w);flex:0 0 var(--side-w);background:var(--bg-soft);border-right:1px solid var(--line);
  overflow:auto;padding:14px 10px 40px}
.nav-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted-2);
  font-weight:800;margin:16px 8px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;margin-bottom:3px;
  background:none;border:1px solid transparent;border-radius:var(--r-md);cursor:pointer;font-size:13.5px;
  color:var(--muted);font-weight:600}
.nav-item:hover{background:#efe8df;color:var(--text)}
.nav-item.active{background:var(--panel-2);color:var(--primary-dark);border-color:#d9c4b4;font-weight:800}
.nav-item .cnt{margin-left:auto;font-size:11px;font-weight:800;background:#f9ebea;color:#a02020;
  border:1px solid #eec8c5;border-radius:20px;padding:1px 7px}
.nav-item .cnt.info{background:#e4eef1;color:#1d6e80;border-color:#c3d9e0}
.main{flex:1;overflow:auto;padding:20px 22px 60px}

/* ── компоненты ── */
.page-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.page-head h2{margin:0;font-family:var(--font-display);font-size:24px;font-weight:600;letter-spacing:.2px}
.page-head .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
.page-head .spacer{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:14px;
  box-shadow:var(--shadow)}
.panel-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:800;
  margin:0 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13.5px;font-weight:600;color:var(--text)}
.btn:hover{border-color:var(--primary-soft);background:#faf6f1}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700;letter-spacing:.03em}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn-accent:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn-danger{background:#f9ebea;border-color:#e8c8c4;color:#8f1d1d}
.btn-danger:hover{background:#f4dcda;border-color:#dda9a3}
.btn-ghost{background:transparent}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn-block{width:100%;padding:12px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:3px;font-size:11px;
  font-weight:700;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);letter-spacing:.02em}
.badge.ok{background:#e9f0e6;color:#3d6b45;border-color:#cddcc7}
.badge.warn{background:#faf0dc;color:#8a5a10;border-color:#ecd9ae}
.badge.danger{background:#f9ebea;color:#a02020;border-color:#eec8c5}
.badge.muted{background:#f1ece5;color:var(--muted);border-color:#e0d8cd}
.badge.info{background:#e4eef1;color:#1d6e80;border-color:#c3d9e0}
.badge.gold{background:#f7f0da;color:var(--gold-deep);border-color:#e6d6a8}
.stat-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.stat .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:800}
.stat .v{font-family:var(--font-display);font-size:26px;font-weight:600;margin-top:4px;line-height:1.1}
.stat .v small{font-family:var(--font-body);font-size:12.5px;color:var(--muted);font-weight:600}
.stat.accent .v{color:var(--accent)} .stat.warn .v{color:var(--warn)}
.stat.danger .v{color:var(--danger)} .stat.info .v{color:var(--info)}
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .spacer{flex:1}
.seg{display:inline-flex;background:#ece5db;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{background:none;border:none;color:var(--muted);padding:8px 13px;cursor:pointer;font-size:12.5px;font-weight:700}
.seg button.active{background:var(--navy);color:#f3ede2}
input[type=text],input[type=search],input[type=number],input[type=password],input[type=email],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;font-size:13.5px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary-soft);box-shadow:0 0 0 3px rgba(148,88,58,.12)}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;
  letter-spacing:.1em;font-weight:800}
.hint{color:var(--muted-2);font-size:12.5px;margin:10px 0 0}
.empty{text-align:center;color:var(--muted);padding:36px 20px;font-size:14px}
.chk{display:flex;align-items:center;gap:8px;padding:6px;font-size:13.5px;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--primary);flex:none}
.check-list{display:grid;gap:6px;padding:4px;background:#f8f5f0;border:1px solid var(--line-soft);
  border-radius:var(--r-md)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.opt-group-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:800;
  margin:18px 0 8px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.thumb{display:block;width:56px;height:56px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);position:relative}
.thumb img,.thumb .ph{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{display:grid;place-items:center;font-size:20px;background:linear-gradient(140deg,#e7dfd4,#cfc3b4)}
.thumb-del{position:absolute;right:2px;top:2px;background:rgba(20,26,37,.72);color:#fff;border:none;border-radius:3px;
  font-size:11px;padding:1px 5px;cursor:pointer}
.rule-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 4px;
  border-bottom:1px solid var(--line-soft)}
.rule-row:last-child{border-bottom:none}
.rule-row .lbl{font-size:13.5px;font-weight:700}
.rule-row .desc{font-size:12px;color:var(--muted);margin-top:2px}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ── зоны / объекты / чек-лист ── */
.crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.crumb a{color:var(--primary);cursor:pointer;font-weight:700;text-decoration:none;border-bottom:1px dotted rgba(148,88,58,.5)}
.crumb .sep{color:var(--muted-2)}
.zone-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.zone-card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:var(--r-md);padding:14px;cursor:pointer;transition:.12s}
.zone-card:hover{border-color:var(--primary-soft);box-shadow:var(--shadow)}
.zone-card.done{border-left-color:var(--accent)}
.zone-card.bad{border-left-color:var(--danger)}
.zone-card h3{margin:0;font-family:var(--font-display);font-size:19px;font-weight:600}
.zone-card .meta{font-size:12px;color:var(--muted);margin-top:3px}
.bar{height:6px;border-radius:4px;background:#ece5db;overflow:hidden;margin:10px 0 8px;display:flex}
.bar i{display:block;height:100%}
.bar .ok{background:var(--accent)} .bar .bad{background:var(--danger)} .bar .todo{background:#ddd3c6}
.obj-list{display:grid;gap:8px}
.obj{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.obj.taken{border-left-color:var(--warn)} .obj.done{border-left-color:var(--accent)} .obj.bad{border-left-color:var(--danger)}
.obj .t{font-size:15px;font-weight:700}
.obj .d{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.night-item{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px}
.night-item.ok{background:#eff5ec;border-color:#cfdfc8}
.night-item.bad{background:#f9efee;border-color:#e8cfcd}
.night-item .head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.night-item .txt{font-size:14.5px;font-weight:700}
.night-item .sub{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.night-item .body{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.cmt{width:100%;font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding:6px 9px;
  background:#fbf9f7;border-radius:0 var(--r-sm) var(--r-sm) 0;margin-top:8px}

/* ── рассылка ── */
.dsp-group{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:12px;overflow:hidden}
.dsp-head{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--panel-2);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.dsp-head .n{font-weight:800;font-size:14.5px}
.dsp-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;padding:11px 14px;
  border-bottom:1px solid var(--line-soft);align-items:start}
.dsp-item:last-child{border-bottom:none}
.dsp-item.sent{opacity:.55}
.preview{background:#fbf9f7;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;
  font-size:13px;white-space:pre-wrap;line-height:1.5}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:#fff;cursor:pointer;
  font-size:12.5px;font-weight:700;color:var(--muted)}
.tab.active{background:var(--navy);color:#f3ede2;border-color:var(--navy)}
.result-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13px}

/* ── модалка / тосты ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(20,26,37,.5);z-index:100;display:grid;place-items:center;padding:20px;overflow:auto}
.modal{background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--r-lg);width:100%;max-width:560px;
  box-shadow:var(--shadow-lg);max-height:92vh;display:flex;flex-direction:column}
.modal.wide{max-width:860px}
.modal-head{display:flex;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-family:var(--font-display);font-size:19px;font-weight:600}
.modal-head p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.modal-body{padding:18px;overflow:auto}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
.toast-host{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:grid;gap:8px}
.toast{background:var(--navy);color:#f3ede2;padding:11px 16px;border-radius:var(--r-md);box-shadow:var(--shadow-lg);
  font-size:13.5px;max-width:88vw;border-left:3px solid var(--gold)}
.toast.err{border-left-color:#e07a72} .toast.warn{border-left-color:var(--warn)} .toast.ok{border-left-color:#7fc79a}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
  border-bottom:1px solid var(--line);padding:8px 9px;font-weight:800}
table.tbl td{border-bottom:1px solid var(--line-soft);padding:9px;vertical-align:top}
@media(max-width:900px){
  .app{flex-direction:column}.sidenav{width:100%;flex:0 0 auto;display:flex;gap:6px;overflow:auto;padding:8px}
  .nav-group{display:none}.nav-item{white-space:nowrap;width:auto;margin:0}.main{padding:14px}
  .grid-2,.grid-3{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
      <rect width="32" height="32" rx="6" fill="#141a25"/>
      <circle cx="16" cy="15.2" r="8.4" stroke="#cbb05b" stroke-width="1.3" fill="none"/>
      <path d="M16 10.4V16l4 2.6" stroke="#cbb05b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M8.5 25.5h15" stroke="#94583a" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <div>Батлер Сервис<small>Ночной отчёт · v2</small></div>
  </div>
  <div class="spacer"></div>
  <div class="shift">Смена <b>19.10.2026</b> · 20:00–08:00<br>автозакрытие в 08:00 · осталось <b id="tb-left">6 ч 12 мин</b></div>
  <select id="role-switch" title="Роль в прототипе" style="width:auto;padding:6px 9px;font-size:12px;font-weight:700;
    background:rgba(255,255,255,.07);color:#f3ede2;border:1px solid rgba(203,176,91,.45);border-radius:4px">
    <option value="supervisor">Роль: Супервайзер</option>
    <option value="butler">Роль: Батлер</option>
  </select>
  <div class="user-chip">
    <div class="avatar" id="u-ini">ГО</div>
    <div><div class="n" id="u-name">Громова О.П.</div><div class="r" id="u-role">Супервайзер</div></div>
  </div>
  <span class="proto-tag">прототип</span>
</header>

<div class="app">
  <aside class="sidenav" id="sidenav"></aside>
  <main class="main" id="main"></main>
</div>

<div id="modal-backdrop" class="modal-backdrop hidden"><div id="modal" class="modal"></div></div>
<div id="toast-host" class="toast-host"></div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════
   ДЕМО-ДАННЫЕ (в реальности — из API: /api/night/zones, /api/notify/services…)
   ══════════════════════════════════════════════════════════════════════ */
/* Роль переключается в топбаре. Отправлять недостатки может ЛЮБОЙ пользователь
   (решение владельца 19.10.2026), а справочники — только менеджмент (settings.edit). */
const USERS = {
  supervisor: { key: 'supervisor', name: 'Громова О.П.', role: 'Супервайзер', ini: 'ГО', canSettings: true },
  butler:     { key: 'butler',     name: 'Иванов И.И.',  role: 'Батлер',      ini: 'ИИ', canSettings: false },
};
let ME = USERS.supervisor;

const SERVICES = [
  { id: 1, name: 'Батлер-сервис', notify_chat: true, notify_email: true,
    email: 'butler@mriyaresort.ru', cc: 'duty-manager@mriyaresort.ru',
    chats: [{ id: '-1001234567890', title: 'Батлер-сервис · ночная смена' }], active: true },
  { id: 2, name: 'Хозяйственная служба', notify_chat: true, notify_email: false,
    email: 'hk@mriyaresort.ru', cc: '',
    chats: [{ id: '-1009876543210', title: 'Хозяйственная служба · Мрия' }], active: true },
  { id: 3, name: 'Техническая служба', notify_chat: true, notify_email: true,
    email: 'tech@mriyaresort.ru', cc: '',
    chats: [{ id: '-1005550001112', title: 'Техслужба · Мрия' },
            { id: '-1005550009998', title: 'Дежурные инженеры (ночь)' }], active: true },
  { id: 4, name: 'IT-департамент', notify_chat: false, notify_email: true,
    email: 'it@mriyaresort.ru', cc: 'noc@mriyaresort.ru', chats: [], active: true },
];

/* шаблоны пунктов: общие на зону (в реальности — checklist_items.zone_id) */
const TPL_VILLA = [
  { id: 'vit',   text: 'Витражи закрыты',        service: 3 },
  { id: 'light', text: 'Свет выключен',          service: 3 },
  { id: 'clean', text: 'Вилла убрана',           service: 2 },
  { id: 'kit',   text: 'Вилла укомплектована',   service: 1 },
  { id: 'wifi',  text: 'ТВ и Wi-Fi работают',    service: 4 },
];
const TPL_OFFICE = [
  { id: 'equip', text: 'Оборудование выключено',      service: 4 },

const A = {};                       // A[`${zoneId}-${objIdx}`][itemId] = {answer, comment, media, by, at, dispatched}
function key(z, o) { return `${z}-${o}`; }
function zoneById(id) { return ZONES.find(z => z.id === id); }
function svc(id) { return SERVICES.find(s => s.id === id) || { name: 'не назначен', notify_chat: false, notify_email: false, chats: [], email: '' }; }

function seed() {
  ALL_OK.forEach(([z, o]) => {
    A[key(z, o)] = {};
    itemsOf(z, o).forEach(it => {
      A[key(z, o)][it.id] = { answer: 'ok', comment: '', media: [], by: 'Иванов И.И.', at: '23:30', dispatched: null };
    });
  });
  DEFECTS.forEach(d => {
    const k = key(d.z, d.o);
    A[k] = A[k] || {};
    A[k][d.i] = { answer: 'bad', comment: d.comment, media: d.media.map((t, i) => ({
      type: t, name: t === 'photo' ? `IMG_${1000 + i}.jpg` : `VID_${2000 + i}.mp4`, url: '' })),
      by: d.by, at: d.at, dispatched: d.dispatched || null };
  });
  Object.keys(TAKEN_BY).forEach(k => {
    const [z, o] = k.split('-').map(Number);
    A[k] = A[k] || {};
    itemsOf(z, o).forEach(it => { if (!A[k][it.id]) A[k][it.id] = { answer: 'ok', comment: '', media: [], by: TAKEN_BY[k], at: '00:10', dispatched: null }; });
    if (k === '1-8') delete A[k]['kit'];            // объект в работе, не всё отмечено
    if (k === '6-5') { A[k] = {}; A[k]['equip'] = { answer: 'bad', comment: 'Серверная: мигает порт коммутатора, температура 27°', media: [{ type: 'photo', name: 'IMG_1003.jpg', url: '' }], by: 'Громова О.П.', at: '02:05', dispatched: null }; }
  });
}

/* Шаблон пунктов задаётся НА ЗОНУ, но у конкретного объекта его можно править:
   своя формулировка, своя ответственная служба, отключить пункт, добавить свой
   (в данных — таблица checklist_item_overrides: area_id + item_id). */
const OVERRIDES = {
  '1-1': { extra: [{ id: 'crib', text: 'Детская кроватка установлена и исправна', service: 1 }],
           byItem: { clean: { text: 'Вилла убрана (включая детскую комнату)' } } },
  '1-2': { byItem: { wifi: { disabled: true } } },
};
function itemsOf(zid, oid) {
  const z = zoneById(zid);
  const ov = OVERRIDES[key(zid, oid)] || {};
  const byItem = ov.byItem || {};
  const list = z.tpl.map(it => {
    const o = byItem[it.id] || {};
    return { id: it.id, text: o.text || it.text,
      service: o.service || it.service || z.default_service,
      overridden: !!(o.text || o.service), disabled: !!o.disabled };
  });
  return list.filter(it => !it.disabled).concat((ov.extra || []).map(x => Object.assign({ extra: true }, x)));
}
function objStat(z, o) {
  const rec = A[key(z, o)] || {}, items = itemsOf(z, o);
  const total = items.length;
  const answered = items.filter(it => rec[it.id] && rec[it.id].answer).length;
  const bad = items.filter(it => rec[it.id] && rec[it.id].answer === 'bad').length;
  const status = answered === total && total > 0 ? 'done' : (answered > 0 || TAKEN_BY[key(z, o)]) ? 'taken' : 'free';
  return { total, answered, bad, status, taken_by: TAKEN_BY[key(z, o)] || (status !== 'free' ? ME.name : '') };
}
function zoneStat(z) {
  const s = { objects: z.objects.length, done: 0, taken: 0, free: 0, bad: 0, answered: 0, total: 0 };
  z.objects.forEach((_, i) => {
    const st = objStat(z.id, i + 1);
    s[st.status]++; s.bad += st.bad; s.answered += st.answered; s.total += st.total;
  });
  return s;
}
function allDefects() {
  const out = [];
  ZONES.forEach(z => z.objects.forEach((name, i) => {
    const o = i + 1, rec = A[key(z.id, o)] || {};
    itemsOf(z.id, o).forEach(it => {
      const r = rec[it.id];
      if (r && r.answer === 'bad') {
        out.push({ zone: z, object: name, zid: z.id, oid: o, item: it, rec: r,
          service: svc(it.service), sid: it.service });
      }
    });
  }));
  return out;
}
/* «Не отмечено» — тоже попадает в консолидированный отчёт (решение владельца) */
function allUnanswered() {
  const out = [];
  ZONES.forEach(z => z.objects.forEach((name, i) => {
    const o = i + 1, rec = A[key(z.id, o)] || {};
    itemsOf(z.id, o).forEach(it => {
      const r = rec[it.id];
      if (!r || !r.answer) out.push({ zone: z, object: name, zid: z.id, oid: o, item: it,
        rec: r || null, service: svc(it.service), sid: it.service });
    });
  }));
  return out;
}
/* кто вёл обход этой ночью — подставляется в текст сообщения ({duty}) */
function dutyNames() {
  const names = new Set([ME.name]);
  Object.values(A).forEach(rec => Object.values(rec).forEach(r => { if (r && r.by) names.add(r.by); }));
  Object.values(TAKEN_BY).forEach(n => names.add(n));
  return [...names].sort((a, b) => a.localeCompare(b)).join(', ');
}

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'ok');
  el.textContent = msg;
  $('#toast-host').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 3200);
  setTimeout(() => el.remove(), 3700);
}
function openModal(o) {
  const m = $('#modal');
  m.className = 'modal' + (o.wide ? ' wide' : '');
  m.innerHTML = `<div class="modal-head"><div><h3>${esc(o.title)}</h3>${o.subtitle ? `<p>${esc(o.subtitle)}</p>` : ''}</div>
      <button class="x" data-x aria-label="Закрыть">✕</button></div>

    ${o.footer ? `<div class="modal-foot">${o.footer}</div>` : ''}`;
  $('#modal-backdrop').classList.remove('hidden');
  $('[data-x]', m).onclick = closeModal;
  if (o.onMount) o.onMount(m);
  return m;
}
function closeModal() { $('#modal-backdrop').classList.add('hidden'); $('#modal').innerHTML = ''; }
$('#modal-backdrop').addEventListener('click', e => { if (e.target.id === 'modal-backdrop') closeModal(); });
function bar(st) {
  const ok = st.answered - st.bad, w = n => (st.total ? (n / st.total * 100) : 0);
  return `<div class="bar" title="отмечено ${st.answered} из ${st.total}">
    <i class="ok" style="width:${w(ok)}%"></i><i class="bad" style="width:${w(st.bad)}%"></i>
    <i class="todo" style="width:${w(st.total - st.answered)}%"></i></div>`;
}
function mediaThumb(m, onDel) {
  const icon = m.type === 'video' ? '🎬' : '🖼';
  return `<span class="thumb" title="${esc(m.name)}">
    <span class="ph">${m.url ? `<img src="${esc(m.url)}" alt="">` : icon}</span>
    ${onDel ? `<button class="thumb-del" data-del-media="${esc(m.name)}">✕</button>` : ''}</span>`;
}

  const list = z.objects.map((name, i) => ({ name, o: i + 1, st: objStat(z.id, i + 1) }))

      if (state.filter === 'all') return true;

  const s = zoneStat(z);
  return `
  <div class="crumb"><a data-nav="zones">Ночной отчёт</a><span class="sep">/</span><b>${esc(z.name)}</b></div>
  <div class="page-head">
    <div><h2>${esc(z.name)}</h2><div class="sub">${s.objects} объектов · закрыто ${s.done} · замечаний ${s.bad}
      · шаблон зоны: ${z.tpl.map(t => t.text).join(', ')}${Object.keys(OVERRIDES).some(k => k.startsWith(z.id + '-'))
        ? ' · у части объектов есть индивидуальные правки' : ''}</div></div>
    <div class="spacer"></div>
    <button class="btn btn-sm" data-act="first-free">К первому незакрытому</button>

  </div>
  ${bar(s)}
  <div class="toolbar">
    <div class="seg">
      ${[['all', 'Все'], ['free', 'Свободны'], ['taken', 'В работе'], ['done', 'Закрыты'], ['bad', 'С замечаниями']]
        .map(([k, t]) => `<button data-filter="${k}" class="${state.filter === k ? 'active' : ''}">${t}</button>`).join('')}
    </div>
    <input type="search" id="obj-q" placeholder="Поиск: Вилла 4007…" value="${esc(state.q)}" style="max-width:260px">
    <div class="spacer"></div>
    <span class="hint" style="margin:0">показано ${list.length} из ${s.objects}</span>
  </div>
  <div class="obj-list">
    ${list.map(x => `<div class="obj ${x.st.status} ${x.st.bad ? 'bad' : ''}">
      <div><div class="t">${esc(x.name)}</div>
        <div class="d">
          <span class="badge ${x.st.status === 'done' ? 'ok' : x.st.status === 'taken' ? 'warn' : 'muted'}">
            ${x.st.status === 'done' ? 'закрыт' : x.st.status === 'taken' ? 'в работе' : 'свободен'}</span>
          <span>пунктов ${x.st.answered} / ${x.st.total}</span>
          ${x.st.bad ? `<span class="badge danger">Не ОК: ${x.st.bad}</span>` : ''}
          ${x.st.taken_by ? `<span class="badge info">${esc(x.st.taken_by)}</span>` : ''}
        </div></div>
      <div class="row-actions">
        ${x.st.status === 'done'
          ? `<button class="btn btn-sm btn-ghost" data-open="${x.o}">Посмотреть</button>
             <button class="btn btn-sm btn-ghost" data-reopen="${x.o}">Переоткрыть</button>`
          : `<button class="btn btn-sm ${x.st.status === 'taken' ? 'btn-primary' : 'btn-accent'}" data-open="${x.o}">
               ${x.st.status === 'taken' ? 'Продолжить' : 'Взять в работу'}</button>
             <button class="btn btn-sm" data-close="${x.o}">Завершить</button>`}
      </div></div>`).join('') || '<div class="empty">Ничего не найдено</div>'}
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════════

              ${r.dispatched ? `<span class="badge ok">отправлено ${esc(r.dispatched.ts)}</span>` : ''}

            </div>
          </div>
          <div class="row-actions">
            <button class="btn btn-sm ${r.answer === 'ok' ? 'btn-accent' : 'btn-ghost'}" data-ans="ok" data-item="${it.id}">ОК</button>
            <button class="btn btn-sm ${r.answer === 'bad' ? 'btn-danger' : 'btn-ghost'}" data-ans="bad" data-item="${it.id}">Не ОК</button>

        ${open ? `<div class="body">
          <label class="field"><span>Комментарий (что не так, что сделали, кому сообщили)</span>
            <textarea id="cmt-${it.id}" rows="3" maxlength="2000" placeholder="Например: витраж не закрыт, сообщили в техслужбу в 23:40">${esc(r.comment || '')}</textarea></label>

/* ══════════════════════════════════════════════════════════════════════
   ЭКРАН 4 · НЕДОСТАТКИ СМЕНЫ И ОТПРАВКА
   ══════════════════════════════════════════════════════════════════════ */
function defectGroups() {
  const map = new Map();
  allDefects().forEach(d => {
    if (state.onlyNew && d.rec.dispatched) return;
    if (!map.has(d.sid)) map.set(d.sid, { service: d.service, sid: d.sid, items: [] });
    map.get(d.sid).items.push(d);
  });
  return [...map.values()].sort((a, b) => a.service.name.localeCompare(b.service.name));
}
function selKey(sid, z, o, i) { return `${sid}|${z}|${o}|${i}`; }
function uKey(d) { return `u|${d.sid}|${d.zid}|${d.oid}|${d.item.id}`; }
function selUn(sid) { return allUnanswered().filter(d => d.sid === sid && state.usel.has(uKey(d))); }
/* Текст сообщения по шаблону из настроек. {duty} — ночные батлеры смены
   (решение владельца: в теле письма отмечать, кто вёл обход). */
function messageFor(g, un) {
  const lines = g.items.map((d, n) =>
    `${n + 1}. ${d.object} — ${d.item.text}: ${d.rec.comment || 'без комментария'}`
    + (d.rec.media.length ? ` (медиа: ${d.rec.media.length})` : '')
    + ` · ${d.rec.by}, ${d.rec.at}`).join('\n');
  const unLines = (un || []).map((d, n) => `${n + 1}. ${d.object} — ${d.item.text}`).join('\n');
  const items = [lines, unLines ? `Не проверено (не отмечено батлером):\n${unLines}` : '']
    .filter(Boolean).join('\n\n');
  return (SETTINGS.templates.night || '')
    .replace('{date}', '19.10.2026').replace('{shift}', '20:00–08:00')
    .replace('{service}', g.service.name)
    .replace('{items}', items || '—')
    .replace('{duty}', dutyNames())
    .replace('{author}', ME.name).replace('{time}', '02:48');
}
/* план отправки: служба → недостатки + выбранные «не проверено» */
function dispatchPlan(all) {
  const plan = new Map();
  const ensure = (sid, service) => {
    if (!plan.has(sid)) plan.set(sid, { service, sid, items: [], un: [] });
    return plan.get(sid);
  };
  defectGroups().forEach(g => {
    const items = g.items.filter(d => all || state.selection.has(selKey(g.sid, d.zid, d.oid, d.item.id)));
    if (items.length) ensure(g.sid, g.service).items = items;
  });
  allUnanswered().forEach(d => { if (state.usel.has(uKey(d))) ensure(d.sid, d.service).un.push(d); });
  return [...plan.values()].filter(e => e.items.length || e.un.length);
}
function viewDefects() {
  const groups = defectGroups();
  const total = groups.reduce((a, g) => a + g.items.length, 0);
  const sentToday = allDefects().filter(d => d.rec.dispatched).length;
  return `
  <div class="crumb"><a data-nav="zones">Ночной отчёт</a><span class="sep">/</span><b>Недостатки смены</b></div>
  <div class="page-head">
    <div><h2>Недостатки смены</h2>
      <div class="sub">Все «Не ОК» за смену, сгруппированы по ответственным службам.
      Отправьте всё скопом или выберите, что уходит.</div></div>
    <div class="spacer"></div>
    <label class="chk" style="margin:0"><input type="checkbox" id="only-new" ${state.onlyNew ? 'checked' : ''}>
      только не отправленные</label>
    <button class="btn btn-sm" data-act="select-all">Выбрать всё</button>
    <button class="btn btn-sm btn-ghost" data-act="select-none">Снять выбор</button>
    <button class="btn btn-sm btn-primary" data-act="send-selected"
      ${total || state.usel.size ? '' : 'disabled'}>
      Отправить выбранное (${state.selection.size + state.usel.size})</button>
  </div>
  <div class="stat-grid">
    <div class="stat danger"><div class="k">Недостатков к отправке</div><div class="v">${total}</div></div>
    <div class="stat"><div class="k">Служб затронуто</div><div class="v">${groups.length}</div></div>
    <div class="stat ok"><div class="k">Отправлено ранее</div><div class="v">${sentToday}</div></div>
    <div class="stat warn"><div class="k">Не проверено пунктов</div><div class="v">${allUnanswered().length}</div></div>
    <div class="stat info"><div class="k">Медиа во вложении</div>
      <div class="v">${groups.reduce((a, g) => a + g.items.reduce((x, d) => x + d.rec.media.length, 0), 0)}</div></div>
  </div>
  ${groups.length ? groups.map(g => {
    const ch = state.dspChannel[g.sid] || { chat: g.service.notify_chat, email: g.service.notify_email };
    state.dspChannel[g.sid] = ch;
    const targets = [];
    if (ch.chat) g.service.chats.forEach(c => targets.push(`чат «${c.title}»`));
    if (ch.email && g.service.email) targets.push(`письмо ${g.service.email}`);
    return `<div class="dsp-group">
      <div class="dsp-head">
        <label class="chk" style="margin:0"><input type="checkbox" data-group="${g.sid}"
          ${g.items.every(d => state.selection.has(selKey(g.sid, d.zid, d.oid, d.item.id))) ? 'checked' : ''}>
          <b class="n">${esc(g.service.name)}</b></label>
        <span class="badge danger">${g.items.length}</span>
        <span class="hint" style="margin:0">доставка:</span>
        <label class="chk" style="margin:0"><input type="checkbox" data-ch="chat" data-sid="${g.sid}"
          ${ch.chat ? 'checked' : ''} ${g.service.notify_chat ? '' : 'disabled'}> Чат (Telegram)</label>
        <label class="chk" style="margin:0"><input type="checkbox" data-ch="email" data-sid="${g.sid}"
          ${ch.email ? 'checked' : ''} ${g.service.notify_email ? '' : 'disabled'}> Письмо (e-mail)</label>
        <div class="spacer" style="flex:1"></div>
        <span class="hint" style="margin:0">${targets.length ? esc(targets.join(' · ')) : 'канал не выбран — доставка не уйдёт'}</span>
      </div>
      ${g.items.map(d => {
        const k = selKey(g.sid, d.zid, d.oid, d.item.id);
        return `<div class="dsp-item ${d.rec.dispatched ? 'sent' : ''}">
          <input type="checkbox" data-sel="${esc(k)}" ${state.selection.has(k) ? 'checked' : ''}>
          <div><div style="font-weight:700;font-size:13.5px">${esc(d.zone.name)} · ${esc(d.object)} — ${esc(d.item.text)}</div>
            <div class="hint" style="margin:3px 0 0">${esc(d.rec.comment || 'без комментария')}</div>
            <div class="row-actions" style="margin-top:6px">
              <span class="badge muted">${esc(d.rec.by)} · ${esc(d.rec.at)}</span>
              ${d.rec.media.length ? `<span class="badge info">📷 ${d.rec.media.filter(m => m.type === 'photo').length}
                🎬 ${d.rec.media.filter(m => m.type === 'video').length}</span>` : ''}
              ${d.rec.dispatched ? `<span class="badge ok">отправлено ${esc(d.rec.dispatched.ts)}</span>` : ''}
            </div></div>
          <div class="row-actions"><button class="btn btn-sm btn-ghost" data-goto="${d.zid}|${d.oid}">К объекту</button></div>
        </div>`; }).join('')}
      <div style="padding:12px 14px;background:var(--bg-soft);border-top:1px solid var(--line)">
        <div class="panel-title" style="margin-bottom:6px">Предпросмотр сообщения · ${esc(g.service.name)}</div>
        <div class="preview">${esc(messageFor(g, selUn(g.sid)))}</div>
        ${ch.email && g.service.email ? `<div class="hint">Тема письма: «Ночной отчёт 19.10.2026 — замечания (${esc(g.service.name)})»
          · получатели: ${esc(g.service.email)}${g.service.cc ? ', копия: ' + esc(g.service.cc) : ''}
          · вложений: ${g.items.reduce((x, d) => x + d.rec.media.length, 0)}</div>` : ''}
      </div>
    </div>`; }).join('')
    : `<div class="panel"><div class="empty">Недостатков нет — все пункты «ОК» или уже отправлены.</div></div>`}
  ${(() => {
    const un = allUnanswered();
    if (!un.length) return '';
    return `<div class="panel">
      <h3 class="panel-title">Не проверено (не отмечено батлером) · ${un.length}</h3>
      <label class="chk" style="margin-bottom:8px"><input type="checkbox" id="un-all"
        ${un.every(d => state.usel.has(uKey(d))) ? 'checked' : ''}> Включить все в рассылку</label>
      <div class="obj-list">${un.map(d => `<div class="obj">
        <div><div class="t">${esc(d.zone.name)} · ${esc(d.object)} — ${esc(d.item.text)}</div>
          <div class="d"><span class="badge gold">${esc(d.service.name)}</span>
            <span class="badge muted">не отмечено</span></div></div>
        <div class="row-actions">
          <label class="chk" style="margin:0"><input type="checkbox" data-usel="${esc(uKey(d))}"
            ${state.usel.has(uKey(d)) ? 'checked' : ''}> в рассылку</label>
          <button class="btn btn-sm btn-ghost" data-goto="${d.zid}|${d.oid}">К объекту</button>
        </div></div>`).join('')}</div>
      <p class="hint">Неотмеченные пункты тоже включаются в консолидированный отчёт — отдельным блоком
      «Не проверено» в тексте сообщения и отдельной таблицей в DOCX/PDF.</p></div>`;
  })()}
  <p class="hint">Отправить может любой пользователь обхода (не только супервайзер): факт отправки
  помечается у пункта и пишется в журнал. Отправка — только вручную. Каждая запись создаётся
  на канал и получателя (если один чат закреплён за несколькими службами — каждая служба шлёт
  своё сообщение, не объединяем). Если недостаток исправили после отправки — дополнительно ничего
  не уходит: ни «исправлено», ни отзыва сообщения; в обходе такой пункт помечается
  «исправлено после отправки». Пункты помечаются как
  «отправлено» и прикрепляет медиа. При ошибке (например, SMTP) запись остаётся со статусом «сбой» и кнопкой «Повторить».</p>`;
}

/* ══════════════════════════════════════════════════════════════════════
   ЭКРАН 5 · ЖУРНАЛ ОТПРАВОК
   ══════════════════════════════════════════════════════════════════════ */
function viewJournal() {
  return `
  <div class="crumb"><a data-nav="zones">Ночной отчёт</a><span class="sep">/</span><b>Журнал отправок</b></div>
  <div class="page-head"><div><h2>Журнал отправок</h2>
    <div class="sub">Общий для всего приложения: видно, какой раздел, кто, кому и что отправил,

    <div class="spacer"></div>
    <button class="btn btn-sm btn-ghost" data-act="export-log">Выгрузить CSV</button></div>
  <div class="panel" style="padding:6px 14px">
    <table class="tbl"><thead><tr>
      <th>Время</th><th>Раздел</th><th>Кто</th><th>Получатель</th><th>Канал</th><th>Кому</th>
      <th>Позиций</th><th>Статус</th><th></th></tr></thead>
      <tbody>${DISPATCHES.slice().reverse().map(d => `<tr>
        <td>${esc(d.ts)}</td><td><span class="badge muted">${esc(d.domain || 'Ночной отчёт')}</span></td>
        <td>${esc(d.actor)}</td><td>${esc(d.service)}</td>
        <td><span class="badge ${d.channel === 'telegram' ? 'info' : 'muted'}">${d.channel === 'telegram' ? 'чат Telegram' : 'e-mail'}</span></td>
        <td>${esc(d.target)}</td>
        <td>${d.items}${d.un ? ` <span class="badge muted" title="неотмеченные пункты">+${d.un} не проверено</span>` : ''}</td>
        <td>${d.status === 'sent' ? `<span class="badge ok">отправлено</span> <span class="hint">${esc(d.external || '')}</span>`
          : `<span class="badge danger">сбой</span> <span class="hint">${esc(d.error || '')}</span>`}</td>
        <td><div class="row-actions">
          ${d.status === 'failed' ? `<button class="btn btn-sm" data-resend="${d.id}">Повторить</button>` : ''}
          <button class="btn btn-sm btn-ghost" data-show-msg="${d.id}">Текст</button></div></td>
      </tr>`).join('') || '<tr><td colspan="9"><div class="empty">Отправок пока не было</div></td></tr>'}</tbody></table>
  </div>`;
}

function stOverrides() {

    <h3 class="panel-title">Индивидуальные особенности объекта</h3>

    <h3 class="panel-title">Журнал и повторная отправка</h3>
    <div class="row-actions">
      <button class="btn btn-sm" data-nav="journal">Открыть журнал отправок</button>
      <span class="hint" style="margin:0">общий для всех разделов: раздел, получатель, канал, статус,
      ошибка доставки и кнопка «Повторить»</span></div>

  <div class="panel">
    <h3 class="panel-title">Медиа и хранение</h3>
    <div class="grid-3">
      <label class="field"><span>Срок хранения, дней</span><input type="number" id="md-ret" value="${esc(SETTINGS.retention_days)}"></label>
      <label class="field"><span>Фото, МБ</span><input type="number" id="md-photo" value="${esc(SETTINGS.photo_max_mb)}"></label>
      <label class="field"><span>Видео, МБ</span><input type="number" id="md-video" value="${esc(SETTINGS.video_max_mb)}"></label>

    остаются (в интерфейсе — «фото недоступно»).</p>

function viewAbout() {

      <p class="hint">Всё перечисленное кликабельно в этом макете: ответы ОК/Не ОК меняют счётчики зон,

      в Telegram и письмо не выполняются: показывается результат и запись в журнале. «Проверить токен»,
      «Определить чаты» и «Тестовое письмо» — заглушки ответов. Видео/фото можно приложить с устройства
      (покажется миниатюра) или кнопкой «демо-фото/демо-видео».</p></div>
    <div class="panel"><h3 class="panel-title">Как ляжет на код</h3>

      <code>checklist_overrides</code> (индивидуальные правки объекта), <code>night_areas.zone_id</code>,
      снимок зоны и чек-листа в отчёте.</p>
      <p class="hint"><b>Дальше:</b> <code>responsibility_services</code> (службы и каналы),
      <code>notify_dispatches</code> — ОБЩИЙ журнал отправок с колонкой «раздел»,
      <code>photos.media_type</code> (видео). Общий слой доставки — пакет <code>app/notify/</code>
      (транспорт Telegram Bot API и SMTP/Exchange + шаблоны), учётные данные в <code>settings</code>
      (маскируются, право <code>settings.edit</code>), экран — <b>Настройки → Чаты и Почта</b>

      разделы подключаются со своими шаблонами и правилами выбора получателей. Новое право
      <code>night.dispatch</code> не вводим: отправляет любой (решение владельца).</p>
      <p class="hint">Подробнее — <code>docs/PROPOSAL-NIGHT-REPORT-V2.md</code> и
      <code>docs/archive/changes/CHANGES-2026-10-19-night-report-v2.md</code>.</p></div>
    <div class="panel"><h3 class="panel-title">Решения владельца (19.10.2026)</h3>
      <ol style="margin:0;padding-left:20px;color:var(--muted);font-size:13px;line-height:1.65">
        <li><b>Чек-лист — общий на зону</b>, но с правками под объект: своя формулировка, своя служба,
          отключить пункт, добавить свой (панель «Индивидуальные особенности объекта»).</li>
        <li><b>Лимиты видео — в настройках</b>, как у фото: размер и срок хранения.</li>
        <li><b>Отправлять может любой</b> пользователь обхода; отправленное помечается у пункта
          и пишется в журнал.</li>
        <li><b>Отправка только вручную</b> — автоматически при закрытии объекта или смены ничего не уходит.</li>
        <li><b>Личные уведомления сотрудникам не нужны</b>; в теле сообщения указываются ночные батлеры смены
          (плейсхолдер <code>{duty}</code>). <code>{deadline}</code> убран.</li>
        <li><b>«Не отмечено» включается</b> в консолидированный отчёт — отдельным блоком «Не проверено»
          (и отдельной таблицей в DOCX/PDF).</li>
        <li><b>Электрокары — отдельным шагом</b>, в зоны не переносим.</li>
        <li><b>Список чатов получаем в настройках Telegram</b> (getUpdates), а закрепляем найденный чат
          в карточке службы.</li>
      <li><b>Почта — через MS Exchange</b>: приложение позже включат в домен, поэтому отправка
          через внутренний релей (без логина/пароля) или SMTP AUTH; в перспективе — Graph/EWS.</li>
        <li><b>Если недостаток исправили — ничего не отправляем</b>: ни «исправлено», ни отзыва
          сообщения. Факт остаётся в журнале, в обходе пункт помечается «исправлено после отправки».</li>
        <li><b>Размер видео — 50 МБ</b> (лимит Telegram Bot API), как в настройках.</li>
        <li><b>Общих чатов у служб не предполагаем</b>; если так вышло — каждая служба отправляет
          своё сообщение всем своим получателям (не объединяем и не дедуплицируем).</li>
        <li><b>Telegram и почта — в общих настройках приложения</b> («Чаты и Почта», <code>#/settings/notify</code>),
          а не внутри ночного отчёта: доставка понадобится и другим разделам (электрокары, заявления,
          закрытие периода, отметки). Общие — токены, каталог чатов, SMTP/Exchange, лимиты медиа и журнал
          отправок; у каждого раздела — свой шаблон и свои получатели.</li>
      </ol>
      <p class="hint">Открытых вопросов нет — можно брать в реализацию (этапы ниже).</p></div>
  </div>
  <div class="panel"><h3 class="panel-title">Этапы внедрения</h3>
    <table class="tbl"><thead><tr><th>Этап</th><th>Содержание</th><th>Оценка</th></tr></thead><tbody>
      <tr><td>1</td><td>Зоны + миграция из категорий, трёхуровневая навигация, прогресс по зонам</td><td>2–3 дня</td></tr>
      <tr><td>2</td><td>Медиа: видео, лимиты, альбомы, отдача с Range</td><td>1 день</td></tr>
      <tr><td>3</td><td>Ответственные службы, служба у пункта, снимок в отчёте, экраны настроек</td><td>1–2 дня</td></tr>
      <tr><td>4</td><td>Интеграции: Telegram (токен, чаты), SMTP, шаблон, маскирование токенов</td><td>2 дня</td></tr>
      <tr><td>5</td><td>«Недостатки», журнал отправок, ретраи, право night.dispatch</td><td>2 дня</td></tr>
      <tr><td>6</td><td>DOCX/PDF с зонами и службами, тесты и сценарий jsdom, документация</td><td>1–2 дня</td></tr>
    </tbody></table></div>`;
}

/* ══════════════════════════════════════════════════════════════════════
   ДЕЙСТВИЯ

function bind() {
  const m = $('#main');
  $$('[data-nav]', m).forEach(b => b.onclick = () => go(b.dataset.nav));
  $$('[data-zone]', m).forEach(b => b.onclick = () => go('objects', { zoneId: Number(b.dataset.zone), filter: 'all', q: '' }));
  $$('[data-filter]', m).forEach(b => b.onclick = () => { state.filter = b.dataset.filter; render(); });
  $$('[data-st]', m).forEach(b => b.onclick = () => { state.stTab = b.dataset.st; render(); });
  $$('[data-items-zone]', m).forEach(b => b.onclick = () => { state.zoneId = Number(b.dataset.itemsZone); render(); });
  $$('[data-objects]', m).forEach(b => b.onclick = () => { state.zoneId = Number(b.dataset.objects); render(); });
  const q = $('#obj-q'); if (q) q.oninput = e => { state.q = e.target.value.trim(); render(); const el = $('#obj-q'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } };

  /* объекты */
  $$('[data-open]', m).forEach(b => b.onclick = () => {
    const o = Number(b.dataset.open);
    if (!TAKEN_BY[key(state.zoneId, o)] || TAKEN_BY[key(state.zoneId, o)] === ME.name) TAKEN_BY[key(state.zoneId, o)] = ME.name;
    go('checklist', { o, openItem: null });
  });
  $$('[data-reopen]', m).forEach(b => b.onclick = () => {
    const o = Number(b.dataset.reopen), k = key(state.zoneId, o);
    const z = zoneById(state.zoneId);
    TAKEN_BY[k] = ME.name;
    A[k] = A[k] || {};
    z.tpl.forEach(it => { if (A[k][it.id]) A[k][it.id].answer = ''; });
    toast('Объект переоткрыт — отметки сброшены', 'warn'); render();
  });
  $$('[data-close]', m).forEach(b => b.onclick = () => closeObject(Number(b.dataset.close)));
  const take = $('[data-take]', m);
  if (take) take.onclick = () => {
    const k = key(state.zoneId, state.o), prev = TAKEN_BY[k];
    if (prev && prev !== ME.name) {
      openModal({ title: 'Объект уже ведут', subtitle: prev,
        body: `<p style="margin:0;color:var(--muted)">Этот объект проверяет ${esc(prev)}. Перехватить?
          Отметка перейдёт вам, факт перехвата попадёт в отчёт.</p>`,
        footer: `<button class="btn btn-ghost" data-no>Отмена</button><button class="btn btn-danger" data-yes>Перехватить</button>`,
        onMount(mm) { $('[data-no]', mm).onclick = closeModal;
          $('[data-yes]', mm).onclick = () => { TAKEN_BY[k] = ME.name; closeModal(); toast('Объект перехвачен', 'warn'); render(); }; } });
    } else { TAKEN_BY[k] = ME.name; toast('Объект за вами', 'ok'); render(); }
  };
  const fin = $('[data-finish]', m);
  if (fin) fin.onclick = () => closeObject(state.o);

  /* пункты чек-листа */
  $$('[data-ans]', m).forEach(b => b.onclick = () => {
    const it = b.dataset.item, k = key(state.zoneId, state.o);
    A[k] = A[k] || {};
    const r = A[k][it] = A[k][it] || { answer: '', comment: '', media: [], by: '', at: '', dispatched: null };
    r.answer = r.answer === b.dataset.ans ? '' : b.dataset.ans;
    r.by = ME.name; r.at = '02:48';
    if (!TAKEN_BY[k]) TAKEN_BY[k] = ME.name;
    if (r.answer === 'bad') { state.openItem = it; toast('Отметка «Не ОК» — добавьте комментарий и медиа', 'warn'); }
    render();
  });
  $$('[data-expand]', m).forEach(b => b.onclick = () => {
    state.openItem = state.openItem === b.dataset.expand ? null : b.dataset.expand; render();
  });
  $$('[data-save]', m).forEach(b => b.onclick = () => {
    const it = b.dataset.save, k = key(state.zoneId, state.o);
    const ta = $(`#cmt-${it}`, m);
    A[k] = A[k] || {}; A[k][it] = A[k][it] || { answer: '', media: [], dispatched: null };
    A[k][it].comment = ta ? ta.value.trim() : '';
    A[k][it].by = ME.name; A[k][it].at = '02:48';
    if (!A[k][it].answer) A[k][it].answer = 'ok';
    if (!TAKEN_BY[k]) TAKEN_BY[k] = ME.name;
    state.openItem = null; toast('Пункт сохранён', 'ok'); render();
  });
  $$('[data-demo]', m).forEach(b => b.onclick = () => {
    const it = b.dataset.item, k = key(state.zoneId, state.o), type = b.dataset.demo;
    A[k] = A[k] || {}; A[k][it] = A[k][it] || { answer: '', comment: '', media: [], dispatched: null };
    const n = A[k][it].media.filter(x => x.type === type).length + 1;
    A[k][it].media.push({ type, name: type === 'photo' ? `IMG_${1000 + n}.jpg` : `VID_${2000 + n}.mp4`, url: '' });
    if (!A[k][it].answer) A[k][it].answer = 'bad';
    A[k][it].by = ME.name; A[k][it].at = '02:48';
    render(); toast(type === 'photo' ? 'Демо-фото приложено' : 'Демо-видео приложено', 'ok');
  });
  $$('[data-media]', m).forEach(inp => inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const it = inp.dataset.item, k = key(state.zoneId, state.o);
    const type = inp.dataset.media === 'auto' ? (f.type.startsWith('video') ? 'video' : 'photo') : inp.dataset.media;
    A[k] = A[k] || {}; A[k][it] = A[k][it] || { answer: '', comment: '', media: [], dispatched: null };
    const push = url => {
      A[k][it].media.push({ type, name: f.name, url: url || '' });
      if (!A[k][it].answer) A[k][it].answer = 'bad';
      A[k][it].by = ME.name; A[k][it].at = '02:48';
      render(); toast('Медиа приложено: ' + f.name, 'ok');
    };
    try {
      const rd = new FileReader();
      rd.onload = () => push(type === 'photo' ? String(rd.result) : '');
      rd.onerror = () => push('');
      if (type === 'photo') rd.readAsDataURL(f); else push('');
    } catch (e) { push(''); }
  });
  $$('[data-del-media]', m).forEach(b => b.onclick = () => {
    const it = state.openItem, k = key(state.zoneId, state.o);
    if (it && A[k] && A[k][it]) {
      A[k][it].media = A[k][it].media.filter(x => x.name !== b.dataset.delMedia);
      render(); toast('Медиа удалено', 'warn');
    }
  });

  /* недостатки и отправка */
  const onlyNew = $('#only-new', m); if (onlyNew) onlyNew.onchange = () => { state.onlyNew = onlyNew.checked; render(); };
  $$('[data-sel]', m).forEach(cb => cb.onchange = () => {
    const k = cb.dataset.sel;
    if (cb.checked) state.selection.add(k); else state.selection.delete(k);
    const btn = $('[data-act="send-selected"]', m);
    if (btn) btn.textContent = `Отправить выбранное (${state.selection.size})`;
    const g = groupsById();
    Object.keys(g).forEach(sid => {
      const head = $(`[data-group="${sid}"]`, m);
      if (head) head.checked = g[sid].every(k2 => state.selection.has(k2));
    });
  });
  $$('[data-group]', m).forEach(cb => cb.onchange = () => {
    const sid = Number(cb.dataset.group);
    allDefects().filter(d => (d.sid) === sid && (!state.onlyNew || !d.rec.dispatched))
      .forEach(d => { const k = selKey(sid, d.zid, d.oid, d.item.id);
        if (cb.checked) state.selection.add(k); else state.selection.delete(k); });
    render();
  });
  $$('[data-ch]', m).forEach(cb => cb.onchange = () => {
    const sid = Number(cb.dataset.sid);
    state.dspChannel[sid] = state.dspChannel[sid] || {};
    state.dspChannel[sid][cb.dataset.ch] = cb.checked; render();
  });
  const unAll = $('#un-all', m);
  if (unAll) unAll.onchange = () => {
    allUnanswered().forEach(d => { if (unAll.checked) state.usel.add(uKey(d)); else state.usel.delete(uKey(d)); });
    render();
  };
  $$('[data-usel]', m).forEach(cb => cb.onchange = () => {
    if (cb.checked) state.usel.add(cb.dataset.usel); else state.usel.delete(cb.dataset.usel);
    render();
  });
  $$('[data-goto]', m).forEach(b => b.onclick = () => {
    const [z, o] = b.dataset.goto.split('|').map(Number);
    go('checklist', { zoneId: z, o, openItem: null });
  });
  $$('[data-act]', m).forEach(b => b.onclick = () => act(b.dataset.act));
  $$('[data-resend]', m).forEach(b => b.onclick = () => {
    const d = DISPATCHES.find(x => x.id === Number(b.dataset.resend));
    d.status = 'sent'; d.error = ''; d.external = 'msg ' + (4400 + d.id); d.ts = '02:52';
    toast('Повторная отправка выполнена', 'ok'); render();
  });
  $$('[data-show-msg]', m).forEach(b => b.onclick = () => {
    const d = DISPATCHES.find(x => x.id === Number(b.dataset.showMsg));
    openModal({ title: 'Отправленный текст', subtitle: `${d.service} · ${d.channel} · ${d.ts}`,
      body: `<div class="preview">${esc(messageFor({ service: { name: d.service }, items: [
          { object: 'Винная вилла 8003', item: { text: 'Витражи закрыты' },
            rec: { comment: 'витраж приоткрыт, ветер хлопает', media: [], by: 'Сидорова С.С.', at: '01:30' } }] }, []))}</div>
        <p class="hint">Получатель: ${esc(d.target)} · недостатков: ${d.items}${d.un ? ` · не проверено: ${d.un}` : ''}
        · статус: ${d.status === 'sent' ? 'отправлено' : 'сбой'}
        ${d.external ? ' · ' + esc(d.external) : ''}${d.error ? ' · ' + esc(d.error) : ''}
        ${d.note ? ' · комментарий: ' + esc(d.note) : ''}</p>`,
      footer: `<button class="btn btn-ghost" data-x2>Закрыть</button>`,
      onMount(mm) { $('[data-x2]', mm).onclick = closeModal; } });
  });

  /* настройки: службы */
  $$('[data-svc-add]', m).forEach(b => b.onclick = () => serviceModal(null));
  $$('[data-svc-edit]', m).forEach(b => b.onclick = () => serviceModal(svc(Number(b.dataset.svcEdit))));
  $$('[data-svc-test]', m).forEach(b => b.onclick = () => testDelivery(svc(Number(b.dataset.svcTest))));
  $$('[data-svc-del]', m).forEach(b => b.onclick = () => {
    const s = svc(Number(b.dataset.svcDel)); s.active = false;
    toast(`Служба «${s.name}» отключена`, 'warn'); render();
  });
  $$('[data-svc-of]', m).forEach(sel => sel.onchange = () => {
    const z = zoneById(state.zoneId || 1), it = z.tpl.find(t => t.id === sel.dataset.svcOf);
    it.service = Number(sel.value) || null;
    toast(`«${it.text}» → ${svc(it.service || z.default_service).name}`, 'ok');
  });

  /* настройки: зоны / объекты / пункты */
  const nzAdd = $('#nz-add', m); if (nzAdd) nzAdd.onclick = () => {
    const name = $('#nz-name', m).value.trim();
    if (!name) return toast('Введите название зоны', 'warn');
    ZONES.push({ id: ZONES.length + 1, name, default_service: Number($('#nz-svc', m).value),
      tpl: TPL_VILLA.map(t => Object.assign({}, t)), objects: [] });
    toast(`Зона «${name}» добавлена`, 'ok'); render();
  };
  $$('[data-zone-edit]', m).forEach(b => b.onclick = () => {
    const z = zoneById(Number(b.dataset.zoneEdit));
    openModal({ title: 'Зона: ' + z.name,
      body: `<label class="field"><span>Название</span><input type="text" id="ze-name" value="${esc(z.name)}"></label>
        <label class="field"><span>Служба по умолчанию</span><select id="ze-svc">
          ${SERVICES.map(s => `<option value="${s.id}" ${s.id === z.default_service ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>
        <p class="hint">Объектов в зоне: ${z.objects.length}. Пунктов в шаблоне: ${z.tpl.length}.</p>`,
      footer: `<button class="btn btn-ghost" data-c>Отмена</button><button class="btn btn-primary" data-ok>Сохранить</button>`,
      onMount(mm) { $('[data-c]', mm).onclick = closeModal;
        $('[data-ok]', mm).onclick = () => { z.name = $('#ze-name', mm).value.trim() || z.name;
          z.default_service = Number($('#ze-svc', mm).value); closeModal(); toast('Зона сохранена', 'ok'); render(); }; } });
  });

function groupsById() {
  const g = {};
  allDefects().forEach(d => {
    if (state.onlyNew && d.rec.dispatched) return;
    (g[d.sid] = g[d.sid] || []).push(selKey(d.sid, d.zid, d.oid, d.item.id));
  });
  return g;
}
function closeObject(o) {
  const z = zoneById(state.zoneId), st = objStat(z.id, o);
  const doClose = () => {
    const k = key(z.id, o); A[k] = A[k] || {}; TAKEN_BY[k] = TAKEN_BY[k] || ME.name;
    z.tpl.forEach(it => { if (!A[k][it.id] || !A[k][it.id].answer) A[k][it.id] = { answer: 'ok', comment: '', media: [], by: ME.name, at: '02:50', dispatched: null }; });
    toast(`«${z.objects[o - 1]}» закрыт`, 'ok');
    go('objects', { o: null });
  };
  if (st.answered < st.total) {
    openModal({ title: 'Есть неотмеченные пункты', subtitle: z.objects[o - 1],
      body: `<p style="margin:0;color:var(--muted)">Отмечено ${st.answered} из ${st.total}.
        Закрыть объект всё равно? Неотмеченные пункты останутся как «не отмечено» и будут видны супервайзеру.</p>`,
      footer: `<button class="btn btn-ghost" data-c>Отмена</button><button class="btn btn-danger" data-ok>Закрыть всё равно</button>`,
      onMount(mm) { $('[data-c]', mm).onclick = closeModal; $('[data-ok]', mm).onclick = () => { closeModal(); doClose(); }; } });
  } else doClose();
}
function testDelivery(s) {
  const chans = [];
  if (s.notify_chat) s.chats.forEach(c => chans.push(`Telegram → «${c.title}» (${c.id})`));
  if (s.notify_email && s.email) chans.push(`Письмо → ${s.email}${s.cc ? ' (копия ' + s.cc + ')' : ''}`);
  openModal({ title: 'Тест доставки: ' + s.name,
    body: chans.length ? `<div class="preview">${chans.map(c => '✓ ' + c).join('\n')}</div>
      <p class="hint">Прототип: сообщение «[тест] Батлер Сервис — проверка канала» имитировано.
      В продукте уйдёт реально и запишется в журнал со статусом.</p>`
      : `<div class="empty">У службы не настроен ни один канал доставки</div>`,
    footer: `<button class="btn btn-ghost" data-c>Закрыть</button>`,
    onMount(mm) { $('[data-c]', mm).onclick = closeModal; } });
}

        $('#sv-chat-box', mm).classList.toggle('hidden', !$('#sv-chat', mm).checked);
      };
      $('#sv-chat', mm).onchange = sync; $('#sv-email', mm).onchange = sync;
      $('[data-c]', mm).onclick = closeModal;
      $('#sv-manual-link', mm).onclick = e => { e.preventDefault(); $('#sv-manual', mm).classList.remove('hidden'); };
      $('#sv-chat-add', mm).onclick = () => {
        const t = $('#sv-chat-title', mm).value.trim(), id = $('#sv-chat-id', mm).value.trim();
        if (!id) return toast('Укажите chat_id', 'warn');
        if (!SETTINGS.telegram_chats.some(c => c.id === id)) SETTINGS.telegram_chats.push({ id, title: t || id });
        $('#sv-chats', mm).insertAdjacentHTML('beforeend', `<label class="chk">
          <input type="checkbox" data-pick-chat="${esc(id)}" checked>
          <span style="flex:1">${esc(t || id)} <small style="color:var(--muted-2)">${esc(id)}</small></span></label>`);
        $('#sv-chat-title', mm).value = ''; $('#sv-chat-id', mm).value = '';
        toast('Чат добавлен в общий список и отмечен', 'ok');
      };
      $('[data-ok]', mm).onclick = () => {
        const name = $('#sv-name', mm).value.trim();
        if (!name) return toast('Введите название службы', 'warn');
        const ids = $$('[data-pick-chat]', mm).filter(cb => cb.checked).map(cb => cb.dataset.pickChat);
        const chats = SETTINGS.telegram_chats.filter(c => ids.includes(c.id));
        const data = { name, notify_chat: $('#sv-chat', mm).checked, notify_email: $('#sv-email', mm).checked,
          email: $('#sv-email', mm).value.trim(), cc: $('#sv-cc', mm).value.trim(), chats, active: true };
        if (data.notify_chat && !chats.length) return toast('Выберите хотя бы один чат или снимите галочку «Чат»', 'warn');
        if (data.notify_email && !data.email) return toast('Укажите почтовый ящик или снимите галочку «Письмо»', 'warn');
        if (isNew) { data.id = Math.max(0, ...SERVICES.map(x => x.id)) + 1; SERVICES.push(data); }
        else Object.assign(d, data);
        closeModal(); toast(isNew ? `Служба «${name}» добавлена` : 'Служба сохранена', 'ok'); render();
      };
    } });
}

function act(a) {
  if (a === 'refresh') { toast('Данные обновлены (в продукте — опрос каждые 60 с)', 'ok'); render(); }
  else if (a === 'docx' || a === 'pdf') toast('Выгрузка ' + a.toUpperCase() + ': зоны, объекты, пункты, служба и медиа', 'ok');
  else if (a === 'to-defects') go('defects');
  else if (a === 'cars-step') openModal({ title: 'Проверка электрокаров', wide: true,
    subtitle: 'Отдельный шаг обхода — как в текущей версии (не зона)',
    body: `<div class="obj-list">
        ${[['1', 'свободен', 'Парковка у главного входа', 'полный', 'проверен 01:52'],
           ['2', 'занят', 'Навес у служебного входа', 'половина', 'проверен 01:54'],
           ['3', 'на зарядке', 'Место с зарядкой у корпуса B', 'разряжен', 'проверен 01:55'],
           ['4', 'свободен', 'Навес у служебного входа', 'полный', 'перепаркован → Парковка у главного входа'],
           ['5', 'на обслуживании', 'Гараж', '—', 'не найден на месте']]
          .map(c => `<div class="obj"><div><div class="t">Кар №${c[0]}</div>
            <div class="d"><span class="badge ${c[1] === 'свободен' ? 'ok' : c[1] === 'занят' ? 'warn' : c[1] === 'на обслуживании' ? 'danger' : 'info'}">${c[1]}</span>
            ${esc(c[2])} · заряд: ${esc(c[3])} · ${esc(c[4])}</div></div>
            <div class="row-actions"><span class="badge muted">📷 1</span></div></div>`).join('')}
      </div>
      <p class="hint">Окно отметки кара уже приведено к окну возврата (PR #43): чекбокс «Кар найден на месте»,
      «Где нашёл» → «Куда переставил» при перепарковке, чекбоксы состояния, фото. В v2 этот шаг остаётся
      отдельным — в зоны не переносится.</p>`,
    footer: `<button class="btn btn-ghost" data-c>Закрыть</button>`,
    onMount(mm) { $('[data-c]', mm).onclick = closeModal; } });
  else if (a === 'close-shift') openModal({ title: 'Закрыть ночную смену?',
    body: `<p style="margin:0;color:var(--muted)">Смена станет доступна только для чтения. Неотправленные
      недостатки (${allDefects().filter(d => !d.rec.dispatched).length}) останутся в журнале обхода —
      отправить можно и после закрытия?</p><p class="hint">В продукте: отправка после закрытия — по праву
      <code>night.dispatch</code>, факт пишется в аудит.</p>`,
    footer: `<button class="btn btn-ghost" data-c>Отмена</button><button class="btn btn-danger" data-ok>Закрыть смену</button>`,
    onMount(m) { $('[data-c]', m).onclick = closeModal;
      $('[data-ok]', m).onclick = () => { closeModal(); toast('Смена закрыта (прототип)', 'warn'); }; } });
  else if (a === 'first-free') {
    const z = zoneById(state.zoneId);
    const i = z.objects.findIndex((_, idx) => objStat(z.id, idx + 1).status !== 'done');
    if (i < 0) return toast('Все объекты зоны закрыты', 'ok');
    TAKEN_BY[key(z.id, i + 1)] = ME.name;
    go('checklist', { o: i + 1, openItem: null });
  }
  else if (a === 'edit-zone') { state.stTab = 'zones'; go('set:zones'); }
  else if (a === 'select-all') {
    allDefects().forEach(d => { if (!state.onlyNew || !d.rec.dispatched) state.selection.add(selKey(d.sid, d.zid, d.oid, d.item.id)); });
    render(); toast('Выбраны все недостатки', 'ok');
  }
  else if (a === 'select-none') { state.selection.clear(); render(); }
  else if (a === 'send-selected') sendDispatch(false);
  else if (a === 'export-log') toast('CSV журнала выгружен (прототип)', 'ok');
}

function sendDispatch(all) {
  const plan = dispatchPlan(all);
  if (!plan.length) return toast(all ? 'Нет недостатков к отправке' : 'Выберите недостатки и канал доставки', 'warn');
  const rows = [];
  plan.forEach(e => {
    const ch = state.dspChannel[e.sid] || { chat: e.service.notify_chat, email: e.service.notify_email };
    if (ch.chat) e.service.chats.forEach(t => rows.push({ e, kind: 'telegram', target: `${t.title} (${t.id})` }));
    if (ch.email && e.service.email) rows.push({ e, kind: 'email', target: e.service.email });
  });
  if (!rows.length) return toast('У выбранных служб не настроены получатели: включите канал, чат или ящик', 'warn');
  const cnt = plan.reduce((a, e) => a + e.items.length, 0);
  const unCnt = plan.reduce((a, e) => a + e.un.length, 0);
  openModal({
    title: all ? 'Отправить все недостатки?' : `Отправить выбранное (${cnt + unCnt})`,
    subtitle: `недостатков: ${cnt}${unCnt ? ` · не проверено: ${unCnt}` : ''} · отправок: ${rows.length}`,
    wide: true,
    body: `<p class="hint" style="margin-top:0">По одной записи на каждый канал и получателя. Отправленные
      пункты помечаются, всё попадает в журнал. Отправка только вручную — автоматически ничего не уходит.</p>
      ${rows.map(r => `<div class="result-row">
        <span class="badge ${r.kind === 'telegram' ? 'info' : 'muted'}">${r.kind === 'telegram' ? 'чат' : 'письмо'}</span>
        <b>${esc(r.e.service.name)}</b> → ${esc(r.target)}
        <span class="hint" style="margin:0">недостатков: ${r.e.items.length}${r.e.un.length ? ` · не проверено: ${r.e.un.length}` : ''}
        · медиа: ${r.e.items.reduce((x, d) => x + d.rec.media.length, 0)}</span></div>`).join('')}
      <div class="opt-group-title">Предпросмотр сообщения · ${esc(plan[0].service.name)}</div>
      <div class="preview">${esc(messageFor(plan[0], plan[0].un))}</div>
      <div class="opt-group-title">Комментарий к отправке (необязательно)</div>
      <textarea id="dsp-note" rows="2" placeholder="Например: прошу отписаться в чат после устранения"></textarea>`,
    footer: `<button class="btn btn-ghost" data-c>Отмена</button>
      <button class="btn btn-primary" data-ok>Отправить (${rows.length})</button>`,
    onMount(mm) {
      $('[data-c]', mm).onclick = closeModal;
      $('[data-ok]', mm).onclick = () => {
        const note = $('#dsp-note', mm).value.trim();
        $('[data-ok]', mm).disabled = true; $('[data-ok]', mm).textContent = 'Отправляем…';
        setTimeout(() => {
          let sent = 0, failed = 0;
          rows.forEach((r, i) => {
            const fail = r.kind === 'email' && SETTINGS.smtp_pass === 'broken';
            fail ? failed++ : sent++;
            DISPATCHES.push({ id: DISPATCHES.length + 1, ts: '02:5' + (i % 10), actor: ME.name,
              domain: 'Ночной отчёт', service: r.e.service.name, channel: r.kind, target: r.target,
              items: r.e.items.length, un: r.e.un.length,
              status: fail ? 'failed' : 'sent', error: fail ? 'SMTP: authentication failed' : '',
              external: fail ? '' : (r.kind === 'telegram' ? 'msg ' + (4500 + i) : 'Message-ID …' + i), note });
            if (!fail) r.e.items.forEach(d => { d.rec.dispatched = { ts: '02:5' + (i % 10), id: DISPATCHES.length }; });
          });
          state.selection.clear(); state.usel.clear();
          closeModal();
          toast(`Отправок: ${sent}${failed ? `, сбоев: ${failed}` : ''} · отправил ${ME.name}`, failed ? 'warn' : 'ok');
          go('journal');
        }, 700);
      };
    } });
}

/* ══════════════════════════════════════════════════════════════════════ */
seed();
applyRole();
$('#role-switch').onchange = e => {
  ME = USERS[e.target.value];
  applyRole(); render();
  toast(`Роль: ${ME.role}. ` + (ME.canSettings
    ? 'Справочники и отправка недостатков доступны'
    : 'Справочники скрыты (нет settings.edit), обход и отправка недостатков доступны'), 'warn');
};
render();
setInterval(() => {
  const el = $('#tb-left'); if (!el) return;
  const t = new Date(Date.now() + 6 * 3600e3 + 12 * 60e3);
  el.textContent = `${t.getUTCHours()} ч ${t.getUTCMinutes()} мин`;
}, 30000);
</script>
</body>
