<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><rect width="1240" height="900" fill="#fff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#98a2b3"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d92d20"/></marker></defs><text x="26" y="32" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#101828">Два ключевых потока: запись отметки и чтение сетки графика</text><text x="26" y="52" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#667085">Числа запросов SQL измерены инструментально (SQLAlchemy before_cursor_execute) на демо-базе: 11 и 50 сотрудников, месяц 31 день</text><rect x="26" y="72" width="560" height="724" rx="12" fill="#f7faf8" stroke="#cfe6d7"/><text x="44" y="98" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#101828">A. POST /api/punches — «Пришёл на работу»</text><text x="44" y="116" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#667085">app/api/punches.py (521) → app/timesheet.py (897) · ~10–14 SQL-запросов, единицы миллисекунд</text><rect x="44" y="132" width="524" height="48" rx="8" fill="#fff" stroke="#2f9e5f" stroke-width="1.3"/><circle cx="62" cy="150" r="10" fill="#2f9e5f"/><text x="62" y="154" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="80" y="154" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.6" font-weight="650" fill="#101828">Телефон/PWA шлёт kind: «auto»</text><text x="80" y="170" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#667085">app.js: явный in/out + флаг punchInFlight от двойного тапа</text><line x1="306" y1="180" x2="306" y2="181" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#a)"/><rect x="44" y="188" width="524" height="48" rx="8" fill="#fff" stroke="#2f9e5f" stroke-width="1.3"/><circle cx="62" cy="206" r="10" fill="#2f9e5f"/><text x="62" y="210" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="80" y="210" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.6" font-weight="650" fill="#101828">current_principal: проверка cookie</text><text x="80" y="226" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#667085">read_token → HMAC-SHA256, exp, users.token_version (отзыв сессий)</text><line x1="306" y1="236" x2="306" y2="237" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#a)"/><rect x="44" y="244" width="524" height="48" rx="8" fill="#fff" stroke="#2f9e5f" stroke-width="1.3"/><circle cx="62" cy="262" r="10" fill="#2f9e5f"/><text x="62" y="266" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="80" y="266" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.6" font-weight="650" fill="#101828">_resolve_employee</text><text x="80" y="282" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#667085">сотрудник сам либо менеджер «за сотрудника» (employee_id в payload)</text><line x1="306" y1="292" x2="306" y2="293" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#a)"/><rect x="44" y="300" width="524" height="48" rx="8" fill="#fff" stroke="#2f9e5f" stroke-width="1.3"/><circle cx="62" cy="318" r="10" fill="#2f9e5f"/><text x="62" y="322" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="80" y="322" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.6" font-weight="650" fill="#101828">threading.Lock по employee_id</text><text x="80" y="338" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#667085">сериализация отметок одного человека — но ТОЛЬКО в пределах процесса uvicorn</text><line x1="306" y1="348" x2="306" y2="349" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#a)"/><rect x="44" y="356" width="524" height="48" rx="8" fill="#fff" stroke="#2f9e5f" stroke-width="1.3"/><circle cx="62" cy="374" r="10" fill="#2f9e5f"/><text x="62" y="378" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="80" y="378" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.6" font-weight="650" fill="#101828">_plan_for_date: план на эту дату</text><text x="80" y="394" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#667085">schedule_entries → shift_revisions → base_shift (цикл/блок); окно смены ± 4/6 ч</text><line x1="306" y1="404" x2="306" y2="405" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#a)"/><rect x="44" y="412" width="524" height="48" rx="8" fill="#fff" stroke="#2f9e5f" stroke-width="1.3"/><circle cx="62" cy="430" r="10" fill="#2f9e5f"/><text x="62" y="434" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="80" y="434" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.6" font-weight="650" fill="#101828">Проверки-«ворота»</text><text x="80" y="450" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#667085">период работы (employment), открытая сессия, дубль ≤ 60 с, punch_in_allowed / override</text><line x1="306" y1="460" x2="306" y2="461" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#a)"/><rect x="44" y="468" width="524" height="48" rx="8" fill="#fff" stroke="#2f9e5f" stroke-width="1.3"/><circle cx="62" cy="486" r="10" fill="#2f9e5f"/><text x="62" y="490" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="80" y="490" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.6" font-weight="650" fill="#101828">INSERT punches + audit_log</text><text x="80" y="506" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#667085">сырая отметка хранится как есть: локальное время объекта, источник, примечание</text><line x1="306" y1="516" x2="306" y2="517" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#a)"/><rect x="44" y="524" width="524" height="48" rx="8" fill="#fff" stroke="#2f9e5f" stroke-width="1.3"/><circle cx="62" cy="542" r="10" fill="#2f9e5f"/><text x="62" y="546" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">8</text><text x="80" y="546" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.6" font-weight="650" fill="#101828">recalc_day → day_pieces → compute_day</text><text x="80" y="562" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#667085">интервалы работы, округление кратно часу, ДЯ/ДН, опоздания, «отпросился», банк часов</text><line x1="306" y1="572" x2="306" y2="573" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#a)"/><rect x="44" y="580" width="524" height="48" rx="8" fill="#fff" stroke="#2f9e5f" stroke-width="1.3"/><circle cx="62" cy="598" r="10" fill="#2f9e5f"/><text x="62" y="602" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">9</text><text x="80" y="602" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.6" font-weight="650" fill="#101828">UPSERT timesheet_rows + commit</text><text x="80" y="618" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#667085">производная строка дня; detail_json хранит сессии и предупреждения</text><line x1="306" y1="628" x2="306" y2="629" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#a)"/><rect x="44" y="636" width="524" height="48" rx="8" fill="#fff" stroke="#2f9e5f" stroke-width="1.3"/><circle cx="62" cy="654" r="10" fill="#2f9e5f"/><text x="62" y="658" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">10</text><text x="80" y="658" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.6" font-weight="650" fill="#101828">Ответ клиенту</text><text x="80" y="674" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#667085">статус дня, план/факт, банк часов, warnings — UI рисует без пересчёта на клиенте</text><rect x="44" y="696" width="524" height="64" rx="8" fill="#fff8f0" stroke="#e0a05e"/><text x="60" y="718" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#8a5a12">Уязвимое место потока записи</text><text x="60" y="736" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.2" fill="#8a5a12">Блокировка threading.Lock не работает при 2+ воркерах uvicorn → нужен SELECT … FOR UPDATE</text><text x="60" y="750" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.2" fill="#8a5a12">(в доках это зафиксировано как осознанное ограничение; лечится переходом на PostgreSQL)</text><rect x="614" y="72" width="600" height="724" rx="12" fill="#fdf7f6" stroke="#f0cfcb"/><text x="632" y="98" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#101828">B. GET /api/schedule — сетка месяца</text><text x="632" y="116" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#667085">app/api/schedule.py:110-268 · самый тяжёлый запрос интерфейса, вызывается при каждом открытии раздела</text><rect x="632" y="132" width="564" height="52" rx="8" fill="#fff" stroke="#98a2b3" stroke-width="1.3"/><circle cx="650" cy="150" r="10" fill="#98a2b3"/><text x="650" y="154" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="668" y="154" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.6" font-weight="650" fill="#101828">Пакетные выборки — сделано правильно</text><text x="668" y="170" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#667085">employees, employment_periods, schedule_entries, timesheet_rows, block_assignments, double_pay_days → 6–8 запросов</text><line x1="914" y1="184" x2="914" y2="185" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#a)"/><rect x="632" y="192" width="564" height="52" rx="8" fill="#fff" stroke="#98a2b3" stroke-width="1.3"/><circle cx="650" cy="210" r="10" fill="#98a2b3"/><text x="650" y="214" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="668" y="214" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.6" font-weight="650" fill="#101828">build_fact_map — тоже пакетно</text><text x="668" y="230" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#667085">timesheet_rows за месяц ± 1 день + punches за сегодня; further разбор detail_json в памяти</text><line x1="914" y1="244" x2="914" y2="245" stroke="#98a2b3" stroke-width="1.6" marker-end="url(#a)"/><rect x="632" y="252" width="564" height="52" rx="8" fill="#fff" stroke="#98a2b3" stroke-width="1.3"/><circle cx="650" cy="270" r="10" fill="#98a2b3"/><text x="650" y="274" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="668" y="274" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.6" font-weight="650" fill="#101828">Цикл по ячейкам: N сотрудников × 31 день</text><text x="668" y="290" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#667085">для 11 сотрудников это 341 итерация, для 50 — 1 550</text><rect x="632" y="316" width="564" height="150" rx="8" fill="#fdecec" stroke="#d92d20" stroke-width="1.5"/><text x="650" y="340" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#b42318">N+1 внутри цикла: ~3 запроса на каждую ячейку</text><circle cx="658" cy="358" r="3.5" fill="#d92d20"/><text x="670" y="362" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" fill="#7a271a" font-weight="600">base_shift() → pattern_for_date()</text><text x="994" y="362" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.4" fill="#b42318">SELECT block_assignments — 308 раз</text><circle cx="658" cy="382" r="3.5" fill="#d92d20"/><text x="670" y="386" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" fill="#7a271a" font-weight="600">find_by_code()</text><text x="994" y="386" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.4" fill="#b42318">SELECT shift_types — 307 раз</text><circle cx="658" cy="406" r="3.5" fill="#d92d20"/><text x="670" y="410" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" fill="#7a271a" font-weight="600">view_at() → ревизия на дату</text><text x="994" y="410" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.4" fill="#b42318">SELECT shift_revisions — 330 раз</text><circle cx="658" cy="430" r="3.5" fill="#d92d20"/><text x="670" y="434" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" fill="#7a271a" font-weight="600">employed_ranges() на сотрудника</text><text x="994" y="434" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.4" fill="#b42318">+1 запрос на строку сетки</text><rect x="632" y="470" width="564" height="34" rx="7" fill="#fff" stroke="#e6b8b4"/><text x="648" y="491" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" fill="#101828" font-weight="600">11 сотрудников (демо-база)</text><text x="1180" y="491" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" fill="#b42318" text-anchor="end" font-weight="700">966 SQL-запросов · 569 мс</text><rect x="632" y="510" width="564" height="34" rx="7" fill="#fff" stroke="#e6b8b4"/><text x="648" y="531" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" fill="#101828" font-weight="600">50 сотрудников</text><text x="1180" y="531" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" fill="#b42318" text-anchor="end" font-weight="700">4 515 SQL-запросов · 2 048 мс</text><rect x="632" y="550" width="564" height="34" rx="7" fill="#fff" stroke="#e6b8b4"/><text x="648" y="571" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" fill="#101828" font-weight="600">POST /api/settings/recalc-all, 50 сотр.</text><text x="1180" y="571" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" fill="#b42318" text-anchor="end" font-weight="700">11 820 запросов · 5,1 с синхронно в HTTP-запросе</text><rect x="632" y="590" width="564" height="34" rx="7" fill="#fff" stroke="#e6b8b4"/><text x="648" y="611" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" fill="#101828" font-weight="600">GET /api/punches/onwork (поллинг 30 с)</text><text x="1180" y="611" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" fill="#b42318" text-anchor="end" font-weight="700">161 запрос · 82 мс — ×N пользователей</text><rect x="632" y="630" width="564" height="34" rx="7" fill="#fff" stroke="#e6b8b4"/><text x="648" y="651" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" fill="#101828" font-weight="600">GET /api/employees, 50 сотр.</text><text x="1180" y="651" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" fill="#b42318" text-anchor="end" font-weight="700">155 запросов · 3,1 на сотрудника + отдельная SessionLocal на каждого (db_car_of)</text><text x="632" y="678" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.4" fill="#b42318">Лечится одним пакетным запросом по shift_types/shift_revisions/block_assignments на месяц</text><text x="632" y="694" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.4" fill="#b42318">и кэшем «шаблон блока на дату» — оценка: S (2–4 часа), эффект: ~90× меньше запросов</text><text x="26" y="876" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#98a2b3">Вывод: поток записи (A) спроектирован аккуратно и дёшев; узкое место системы — потоки чтения (B), где пакетные выборки соседствуют с точечными запросами внутри цикла.</text></svg>