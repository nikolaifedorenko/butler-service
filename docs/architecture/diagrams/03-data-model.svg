<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><rect width="1240" height="700" fill="#fff"/><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#98a2b3"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d92d20"/></marker></defs><text x="26" y="32" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#101828">Модель данных: 30 таблиц в одном app/models.py (695 строк, 303 колонки)</text><text x="26" y="52" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#667085">Группировка по поддоменам — фактическая, а не декларированная: все таблицы объявлены в одном модуле, без разделения на пакеты</text><rect x="46" y="80" width="360" height="190" rx="12" fill="#eef4ff" stroke="none"/><text x="60" y="100" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#101828">Кадры и доступ (8)</text><rect x="60.0" y="120" width="151.0" height="26" rx="8" fill="#fff" stroke="#5b8def" stroke-width="1.3"/><text x="135.5" y="137.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.3" font-weight="500" fill="#101828" text-anchor="middle">employees</text><rect x="221.0" y="120" width="151.0" height="26" rx="8" fill="#fff" stroke="#5b8def" stroke-width="1.3"/><text x="296.5" y="137.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.3" font-weight="500" fill="#101828" text-anchor="middle">users</text><rect x="60.0" y="152" width="151.0" height="26" rx="8" fill="#fff" stroke="#5b8def" stroke-width="1.3"/><text x="135.5" y