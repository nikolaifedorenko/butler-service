<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="490" viewBox="0 0 1180 490" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><rect width="1180" height="490" fill="#ffffff"/><text x="26" y="34" font-size="18" font-weight="700" fill="#101828">Модель данных движка v7.1</text><rect x="26" y="70" width="340" height="62" rx="10" fill="#eaf7ef" stroke="#98a2b3" stroke-width="1.4"/><text x="40" y="92" font-size="12" font-weight="700" fill="#101828">tabel_days</text><text x="40" y="110" font-size="10.5" fill="#667085">Табель (первичный): code, plan_minutes, source</text><rect x="26" y="160" width="340" height="62" rx="10" fill="#eaf7ef" stroke="#98a2b3" stroke-width="1.4"/><text x="40" y="182" font-size="12" font-weight="700" fill="#101828">schedule_shifts</text><text x="40" y="200" font-size="10.5" fill="#667085">График: start/end UTC, source generated|manual, якорь date</text><rect x="26" y="250" width="340" height="62" rx="10" fill="#eaf7ef" stroke="#98a2b3" stroke-width="1.4"/><text x="40" y="272" font-size="12" font-weight="700" fill="#101828">schedule_absences</text><text x="40" y="290" font-size="10.5" fill="#667085">Отсутствия: UTC-интервал ≤24 ч (может через полночь), kind</text><rect x="26" y="340" width="340" height="62" rx="10" fill="#eaf7ef" stroke="#98a2b3" stroke-width="1.4"/><text x="40" y="362" font-size="12" font-weight="700" fill="#101828">punches</text><text x="40" y="380" font-size="10.5" fill="#667085">Отметки: ts (naive local), kind IN|OUT, source, note</text><rect x="420" y="70" width="340" height="62" rx="10" fill="#eef4ff" stroke="#98a2b3" stroke-width="1.4"/><text x="434" y="92" font-size="12" font-weight="700" fill="#101828">engine_settings_versions</text><text x="434" y="110" font-size="10.5" fill="#667085">Версии CFG-*: valid_from, payload_json</text><rect x="420" y="160" width="340" height="62" rx="10" fill="#eef4ff" stroke="#98a2b3" stroke-width="1.4"/><text x="434" y="182" font-size="12" font-weight="700" fill="#101828">day_modifiers</text><text x="434" y="200" font-size="10.5" fill="#667085">CFG-MODIFIERS (уровни 1–6): name, value, emp/group/day/period</text><rect x="420" y="250" width="340" height="62" rx="10" fill="#eef4ff" stroke="#98a2b3" stroke-width="1.4"/><text x="434" y="272" font-size="12" font-weight="700" fill="#101828">double_pay_days · vip_double_pay</text><text x="434" y="290" font-size="10.5" fill="#667085">подмешиваются как «Двойные переработки»</text><rect x="420" y="340" width="340" height="62" rx="10" fill="#eef4ff" stroke="#98a2b3" stroke-width="1.4"/><text x="434" y="362" font-size="12" font-weight="700" fill="#101828">employment_periods</text><text x="434" y="380" font-size="10.5" fill="#667085">трудоустройство: start, end (включительно)</text><rect x="814" y="70" width="340" height="62" rx="10" fill="#fff4e6" stroke="#98a2b3" stroke-width="1.4"/><text x="828" y="92" font-size="12" font-weight="700" fill="#101828">period_closings</text><text x="828" y="110" font-size="10.5" fill="#667085">закрытие: result_json, flags_json, ClosingInputs, банк, версии, revision</text><rect x="814" y="160" width="340" height="62" rx="10" fill="#fff4e6" stroke="#98a2b3" stroke-width="1.4"/><text x="828" y="182" font-size="12" font-weight="700" fill="#101828">deferred_carry</text><text x="828" y="200" font-size="10.5" fill="#667085">вход след. периода: source_day, tariff, minutes (без reason_code)</text><rect x="814" y="250" width="340" height="62" rx="10" fill="#fff4e6" stroke="#98a2b3" stroke-width="1.4"/><text x="828" y="272" font-size="12" font-weight="700" fill="#101828">bank_adjustments</text><text x="828" y="290" font-size="10.5" fill="#667085">корректировки: hours, effective_date, reason_code (OPENING_SEED)</text><text x="26" y="450" font-size="10.5" fill="#98a2b3">Удалены с legacy-движком: timesheet_rows, schedule_entries. Связи: opening(P) = closing(P−1) (period_closings); посев OPENING_SEED — только первый период;</text><text x="26" y="466" font-size="10.5" fill="#98a2b3">save_deferred заменяет вход следующего периода целиком; уникальный ключ period_closings(employee, period_start) исключает конкурентное закрытие.</text></svg>