t-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#101828">Ночной отчёт (6)</text><rect x="440.0" y="380" width="156.0" height="26" rx="8" fill="#fff" stroke="#2f8fb0" stroke-width="1.3"/><text x="518.0" y="397.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.3" font-weight="500" fill="#101828" text-anchor="middle">night_areas</text><rect x="606.0" y="380" width="156.0" height="26" rx="8" fill="#fff" stroke="#2f8fb0" stroke-width="1.3"/><text x="684.0" y="397.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.3" font-weight="500" fill="#101828" text-anchor="middle">checklist_items</text><rect x="440.0" y="412" width="156.0" height="26" rx="8" fill="#fff" stroke="#2f8fb0" stroke-width="1.3"/><text x="518.0" y="429.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.3" font-weight="500" fill="#101828" text-anchor="middle">night_reports</text><rect x="606.0" y="412" width="156.0" height="26" rx="8" fill="#fff" stroke="#2f8fb0" stroke-width="1.3"/><text x="684.0" y="429.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.3" font-weight="500" fill="#101828" text-anchor="middle">night_area_sections</text><rect x="440.0" y="444" width="156.0" height="26" rx="8" fill="#fff" stroke="#2f8fb0" stroke-width="1.3"/><text x="518.0" y="461.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.3" font-weight="500" fill="#101828" text-anchor="middle">night_check_items</text><rect x="606.0" y="444" width="156.0" height="26" rx="8" fill="#fff" stroke="#2f8fb0" stroke-width="1.3"/><text x="684.0" y="461.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.3" font-weight="500" fill="#101828" text-anchor="middle">night_interceptions</text><rect x="806" y="220" width="388" height="140" rx="12" fill="#f2f4f7" stroke="none"/><text x="820" y="240" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#101828">Электрокары (4)</text><rect x="820.0" y="260" width="175.0" height="26" rx="8" fill="#fff" stroke="#7a8699" stroke-width="1.3"/><text x="907.5" y="277.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.3" font-weight="500" fill="#101828" text-anchor="middle">cars</text><rect x="1005.0" y="260" width="175.0" height="26" rx="8" fill="#fff" stroke="#7a8699" stroke-width="1.3"/><text x="1092.5" y="277.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.3" font-weight="500" fill="#101828" text-anchor="middle">car_locations</text><rect x="820.0" y="292" width="175.0" height="26" rx="8" fill="#fff" stroke="#7a8699" stroke-width="1.3"/><text x="907.5" y="309.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.3" font-weight="500" fill="#101828" text-anchor="middle">car_history</text><rect x="1005.0" y="292" width="175.0" height="26" rx="8" fill="#fff" stroke="#7a8699" stroke-width="1.3"/><text x="1092.5" y="309.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.3" font-weight="500" fill="#101828" text-anchor="middle">car_night_checks</text><rect x="806" y="380" width="388" height="100" rx="12" fill="#eceff3" stroke="none"/><text x="820" y="400" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#101828">Сквозные (2)</text><rect x="820.0" y="420" width="180.0" height="26" rx="8" fill="#fff" stroke="#5c6779" stroke-width="1.3"/><text x="910.0" y="437.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.3" font-weight="500" fill="#101828" text-anchor="middle">photos</text><rect x="1010.0" y="420" width="180.0" height="26" rx="8" fill="#fff" stroke="#5c6779" stroke-width="1.3"/><text x="1100.0" y="437.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.3" font-weight="500" fill="#101828" text-anchor="middle">audit_log</text><path d="M 406 175 Q 416.0 175.0 426 175" fill="none" stroke="#98a2b3" stroke-width="1.4" marker-end="url(#ah)"/><text x="416.0" y="169.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.6" fill="#98a2b3" text-anchor="middle">employees → block_assignments</text><path d="M 586 220 Q 586.0 230.0 586 240" fill="none" stroke="#98a2b3" stroke-width="1.4" marker-end="url(#ah)"/><text x="586.0" y="224.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.6" fill="#98a2b3" text-anchor="middle">shift_types → shift_revisions</text><path d="M 786 175 Q 796.0 175.0 806 175" fill="none" stroke="#98a2b3" stroke-width="1.4" marker-end="url(#ah)"/><text x="796.0" y="169.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.6" fill="#98a2b3" text-anchor="middle">schedule_entries → punches</text><path d="M 226 270 Q 226.0 280.0 226 290" fill="none" stroke="#98a2b3" stroke-width="1.4" marker-end="url(#ah)"/><text x="226.0" y="274.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.6" fill="#98a2b3" text-anchor="middle">employee_id</text><path d="M 606 320 Q 606.0 330.0 606 340" fill="none" stroke="#98a2b3" stroke-width="1.4" marker-end="url(#ah)"/><text x="606.0" y="324.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.6" fill="#98a2b3" text-anchor="middle">night_areas → sections</text><path d="M 786 290 Q 796.0 290.0 806 290" fill="none" stroke="#98a2b3" stroke-width="1.4" marker-end="url(#ah)"/><text x="796.0" y="284.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.6" fill="#98a2b3" text-anchor="middle">report_id</text><path d="M 986 360 Q 986.0 370.0 986 380" fill="none" stroke="#98a2b3" stroke-width="1.4" marker-end="url(#ah)"/><text x="986.0" y="364.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.6" fill="#98a2b3" text-anchor="middle">ref_id (полиморфная)</text><text x="26" y="548" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#101828">Что важно знать про схему</text><text x="26" y="570" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" fill="#667085">• Все FK проиндексированы (30 index=True), на punches есть составной индекс (employee_id, ts) — горячий путь отметок закрыт.</text><text x="26" y="587" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" fill="#667085">• timesheet_rows — расчётная (производная) таблица: её можно пересчитать из punches + schedule_entries в любой момент (POST /api/settings/recalc-all).</text><text x="26" y="604" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" fill="#667085">• photos привязана полиморфно (kind + ref_id) без FK — гибко, но целостность не гарантирует БД.</text><text x="26" y="621" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" fill="#667085">• detail_json в timesheet_rows хранит сессии/предупреждения как JSON — схема внутри схемы, читается в factview.py.</text><text x="26" y="638" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.8" fill="#667085">• Ревизии словаря смен (shift_revisions) дают «срез на дату»: прошлые месяцы считаются по прежним часам смены.</text></svg>