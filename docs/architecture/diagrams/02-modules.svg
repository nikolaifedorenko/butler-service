<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="596" viewBox="0 0 1180 596" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><rect width="1180" height="596" fill="#ffffff"/><text x="26" y="34" font-size="18" font-weight="700" fill="#101828">Домен v7.1 — пакеты по стадиям конвейера (каталог 8.1)</text><rect x="26" y="60" width="556" height="50" rx="10" fill="#eaf7ef" stroke="#98a2b3" stroke-width="1.4"/><text x="40" y="82" font-size="12" font-weight="700" fill="#101828">types/</text><text x="40" y="100" font-size="10.5" fill="#667085">сущности · результаты · ошибки · неизменяемость</text><rect x="598" y="60" width="556" height="50" rx="10" fill="#eaf7ef" stroke="#98a2b3" stroke-width="1.4"/><text x="612" y="82" font-size="12" font-weight="700" fill="#101828">codes_registry/</text><text x="612" y="100" font-size="10.5" fill="#667085">Reason (8) · флаги (3) · INV (21)</text><rect x="26" y="118" width="556" height="50" rx="10" fill="#eaf7ef" stroke="#98a2b3" stroke-width="1.4"/><text x="40" y="140" font-size="12" font-weight="700" fill="#101828">settings/</text><text x="40" y="158" font-size="10.5" fill="#667085">Settings · defaults (CFG-*) · validate + 14 checks · resolve_modifier</text><rect x="598" y="118" width="556" height="50" rx="10" fill="#eaf7ef" stroke="#98a2b3" stroke-width="1.4"/><text x="612" y="140" font-size="12" font-weight="700" fill="#101828">validation/</text><text x="612" y="158" font-size="10.5" fill="#667085">9 проверок уровня 2 (стадия 1)</text><rect x="26" y="176" width="556" height="50" rx="10" fill="#eef4ff" stroke="#98a2b3" stroke-width="1.4"/><text x="40" y="198" font-size="12" font-weight="700" fill="#101828">time/</text><text x="40" y="216" font-size="10.5" fill="#667085">round_moment · calc_now · calc_horizon · local_minute · today_of</text><rect x="598" y="176" width="556" height="50" rx="10" fill="#eef4ff" stroke="#98a2b3" stroke-width="1.4"/><text x="612" y="198" font-size="12" font-weight="700" fill="#101828">sessions/</text><text x="612" y="216" font-size="10.5" fill="#667085">pair_marks · check_punch_sequence (CHK-PUNCH-SEQUENCE)</text><rect x="26" y="234" width="556" height="50" rx="10" fill="#eef4ff" stroke="#98a2b3" stroke-width="1.4"/><text x="40" y="256" font-size="12" font-weight="700" fill="#101828">presence/</text><text x="40" y="274" font-size="10.5" fill="#667085">split_by_day · presence_intervals · raw_presence_intervals</text><rect x="598" y="234" width="556" height="50" rx="10" fill="#fff4e6" stroke="#98a2b3" stroke-width="1.4"/><text x="612" y="256" font-size="12" font-weight="700" fill="#101828">day_card/</text><text x="612" y="274" font-size="10.5" fill="#667085">value_of · window/plan (от окна, R34) · План=Факт (R30) · debt (R15) · коды</text><rect x="26" y="292" width="556" height="50" rx="10" fill="#fff4e6" stroke="#98a2b3" stroke-width="1.4"/><text x="40" y="314" font-size="12" font-weight="700" fill="#101828">placement/</text><text x="40" y="332" font-size="10.5" fill="#667085">Codes · seed · credit_unpaid · размещение (ёмкость от окна) · deferred</text><rect x="598" y="292" width="556" height="50" rx="10" fill="#fff4e6" stroke="#98a2b3" stroke-width="1.4"/><text x="612" y="314" font-size="12" font-weight="700" fill="#101828">opening/ + bank/</text><text x="612" y="332" font-size="10.5" fill="#667085">нормализация остатков · available/total · каскад гранулами · close_bank</text><rect x="26" y="350" width="556" height="50" rx="10" fill="#f4f0ff" stroke="#98a2b3" stroke-width="1.4"/><text x="40" y="372" font-size="12" font-weight="700" fill="#101828">schedule/</text><text x="40" y="390" font-size="10.5" fill="#667085">shift_segments (слияние) · merge_absences (UTC) · expected_subintervals</text><rect x="598" y="350" width="556" height="50" rx="10" fill="#f4f0ff" stroke="#98a2b3" stroke-width="1.4"/><text x="612" y="372" font-size="12" font-weight="700" fill="#101828">flags/</text><text x="612" y="390" font-size="10.5" fill="#667085">late · early · off_shift · drop_suppressed_lates · evaluate_flags</text><rect x="26" y="408" width="556" height="50" rx="10" fill="#f4f0ff" stroke="#98a2b3" stroke-width="1.4"/><text x="40" y="430" font-size="12" font-weight="700" fill="#101828">board/</text><text x="40" y="448" font-size="10.5" fill="#667085">open_sessions · expected_now · expected_arrivals · assemble_board</text><rect x="598" y="408" width="556" height="50" rx="10" fill="#eaf6fb" stroke="#98a2b3" stroke-width="1.4"/><text x="612" y="430" font-size="12" font-weight="700" fill="#101828">checks/ + reports/</text><text x="612" y="448" font-size="10.5" fill="#667085">инварианты по стадиям · mgmt_timesheet · exceptions · trace</text><rect x="26" y="466" width="556" height="50" rx="10" fill="#eaf6fb" stroke="#98a2b3" stroke-width="1.4"/><text x="40" y="488" font-size="12" font-weight="700" fill="#101828">pipeline/</text><text x="40" y="506" font-size="10.5" fill="#667085">settle() — 14 стадий (6.3)</text><text x="26" y="556" font-size="10.5" fill="#98a2b3">Правила: одна функция — один файл (≤ ~20 строк); поведение из справочников, не из веток по кодам; литералы бизнес-кодов — только settings/defaults.py;</text><text x="26" y="572" font-size="10.5" fill="#98a2b3">settle() не импортирует flags/; flags/ не знает DayCard/SettleResult (вход — Mapping[date, bool]); board/ и sessions/ не импортируют pipeline/placement/bank/day_card/flags.</text></svg>