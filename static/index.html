<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141a25">
  <title>Батлер Сервис — учёт рабочего времени</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Батлер Сервис">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23141a25'/%3E%3Ccircle cx='16' cy='16' r='9.2' stroke='%23cbb05b' stroke-width='1.4' fill='none'/%3E%3Cpath d='M16 10.4V16l4 2.6' stroke='%23cbb05b' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='1.1' fill='%23cbb05b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/app.css?v=2026-10-31c">
</head>
<body>

<!-- ══════════════════════════ ЭКРАН ВХОДА ══════════════════════════ -->
<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 32 32" width="46" height="46" aria-hidden="true">
        <rect width="32" height="32" rx="6" fill="#141a25"/>
        <circle cx="16" cy="16" r="9.2" stroke="#cbb05b" stroke-width="1.3" fill="none"/>
        <path d="M16 10.4V16l4 2.6" stroke="#cbb05b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="16" cy="16" r="1.1" fill="#cbb05b"/>
      </svg>
      <div>
        <h1>Батлер Сервис</h1>
        <p>Учёт рабочего времени · графики · табель</p>
      </div>
    </div>

    <!-- нативная отправка (POST → 303): браузерные менеджеры паролей показывают
         «Сохранить пароль?» сразу после входа, а не отложенно (16.10.2026) -->
    <form id="login-form" autocomplete="on" action="/api/auth/login-form" method="post">
      <label class="field">
        <span>Логин</span>
        <input id="login-username" name="username" type="text" autocomplete="username" required placeholder="ivanov">
      </label>
      <label class="field">
        <span>Пароль</span>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
      </label>
      <div id="login-error" class="form-error hidden"></div>
      <button class="btn btn-primary btn-block" type="submit">Войти</button>
    </form>

  </div>
</div>

<!-- ══════════════════════════ ПРИЛОЖЕНИЕ ══════════════════════════ -->
<div id="app" class="app hidden">
  <header class="topbar">
    <button class="icon-btn only-mobile" id="nav-toggle" aria-label="Меню">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="brand">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <rect width="32" height="32" rx="6" fill="#0d1119" stroke="#cbb05b" stroke-width="1"/>
        <circle cx="16" cy="16" r="9.2" stroke="#cbb05b" stroke-width="1.3" fill="none"/>
        <path d="M16 10.4V16l4 2.6" stroke="#cbb05b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="16" cy="16" r="1.1" fill="#cbb05b"/>
      </svg>
      <span>Батлер Сервис</span>
    </div>

    <div class="topbar-spacer"></div>

    <div id="impersonation-bar" class="impersonation hidden">
      <span>Вы смотрите как сотрудник</span>
      <button class="btn btn-ghost btn-sm" id="stop-impersonation">Вернуться</button>
    </div>

    <div class="user-chip" id="user-chip">
      <div class="avatar" id="user-avatar">?</div>
      <div class="user-meta">
        <strong id="user-name">—</strong>
        <span id="user-role">—</span>
      </div>
    </div>
    <button class="icon-btn" id="change-pass-btn" title="Сменить пароль" aria-label="Сменить пароль">
      <svg viewBox="0 0 24 24" width="20" height="20"><rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="15" r="1.6" fill="currentColor"/></svg>
    </button>
    <button class="icon-btn" id="logout-btn" title="Выйти" aria-label="Выйти">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h9" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <div class="layout">
    <nav class="sidenav" id="sidenav">
      <div class="sidenav-foot" id="sidenav-foot"></div>
    </nav>

    <main class="content">
      <!-- самопроверка схемы БД (/api/selfcheck): плашка до закрытия, а не исчезающий тост -->
      <div id="schema-banner" class="schema-banner hidden" role="alert"></div>
      <!-- T5 (норматив 12.10.2026): один пункт меню «График» с четырьмя слоями —
           0 Табель · 1 План/График · 2 Факт · 3 Управленческий Табель. Панели слоёв
           вложены в обёртку; переключение — #grafik-tabs (app.js, loadGrafik).
           Доска «Отметки» остаётся отдельным пунктом меню (Q7). -->
      <section id="view-grafik" class="view">
        <div class="layer-tabs" id="grafik-tabs"></div>
        <section id="view-timesheet" class="layer-pane"></section>
        <section id="view-schedule" class="layer-pane"></section>
        <section id="view-fact" class="layer-pane"></section>
        <section id="view-mgmt" class="layer-pane"></section>
      </section>
      <section id="view-marks" class="view"></section>
      <section id="view-employees" class="view"></section>
      <section id="view-night" class="view"></section>
      <section id="view-cars" class="view"></section>
      <section id="view-stays" class="view"></section>
      <section id="view-mystays" class="view"></section>
      <section id="view-me" class="view"></section>
      <section id="view-access" class="view"></section>
      <section id="view-audit" class="view"></section>
      <section id="view-settings" class="view"></section>
    </main>
  </div>

  <nav class="tabbar only-mobile" id="tabbar"></nav>
</div>

<!-- ══════════════════════════ МОДАЛКИ ══════════════════════════ -->

  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>
<div id="toast-host" class="toast-host"></div>
<div id="loading" class="loading hidden"><div class="spinner"></div></div>
