# Локальный запуск и база для тестов. Только для своей машины: пароли здесь учебные,
# порты слушают 127.0.0.1. Боевой профиль — docker-compose.prod.yml.
#
#   docker compose up -d --build     приложение с демо-данными: http://127.0.0.1:8000
#                                     (вход admin / demo1234)
#   docker compose up -d db           только PostgreSQL — для тестов и сценариев интерфейса
#   docker compose down -v            остановить и удалить данные
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: dev
    ports:
      # адрес тестов по умолчанию: postgresql+psycopg2://postgres:dev@127.0.0.1:54329
      - "127.0.0.1:${DB_PORT:-54329}:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  # сервис PDF (ADR-0013, §6): LibreOffice в контейнере делает PDF из DOCX как в Word. Наружу не
  # публикуется; шрифты с кириллицей — из assets/fonts проекта
  gotenberg:
    image: gotenberg/gotenberg:9.9.3
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./assets/fonts:/usr/local/share/fonts/butler:ro

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      gotenberg:
        condition: service_started
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: postgres
      APP_TZ: ${APP_TZ:-Europe/Moscow}
      TZ: ${APP_TZ:-Europe/Moscow}
      # демо-сотрудники с паролем demo1234; 0 — пустая база с администратором ADMIN_PASSWORD
      DEMO_SEED: ${DEMO_SEED:-1}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # демо-вход «как сотрудник» включён по умолчанию (решение владельца); 0 — выключить
      ALLOW_IMPERSONATION: ${ALLOW_IMPERSONATION:-1}
      CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-0}
      GOTENBERG_URL: http://gotenberg:3000
    volumes:
      - app_data:/srv/timetrack/data            # загруженные фото и видео
      - app_templates:/srv/timetrack/templates  # фирменные бланки заявлений

  # воркер очереди задач (ADR-0013, §6): ночные отчёты, доотправка уведомлений, чистка медиа;
  # схему проверяет и ждёт, пока app её подготовит (до этого завершается и перезапускается)
  worker:
    build: .
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: postgres
      APP_TZ: ${APP_TZ:-Europe/Moscow}
      TZ: ${APP_TZ:-Europe/Moscow}
    command: ["python", "-m", "app.bootstrap.jobs_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.bootstrap.jobs_worker", "--check"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    volumes:
      - app_data:/srv/timetrack/data
      - app_templates:/srv/timetrack/templates

volumes:
  pg_data:
  app_data:
  app_templates:
