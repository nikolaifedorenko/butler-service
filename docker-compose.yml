# Запуск: docker compose up -d --build
# Данные (SQLite) лежат в томе tt_data; для PostgreSQL задайте POSTGRES_HOST/USER/PASSWORD/DB
# (или DATABASE_URL) и добавьте сервис db — референс в docker-compose.prod.yml.
services:
  timetrack:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./data/timetrack.db
      # Обязательно задайте в .env:  SECRET_KEY=$(openssl rand -hex 32)
      # Пустой ключ не позволит приложению запуститься (см. app/main.py).
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOW_INSECURE_DEV_SECRET: ${ALLOW_INSECURE_DEV_SECRET:-0}
      APP_TZ: ${APP_TZ:-Europe/Moscow}
      TZ: ${APP_TZ:-Europe/Moscow}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      # демо-вход «как сотрудник» включён по умолчанию (решение владельца); 0 — выключить
      ALLOW_IMPERSONATION: ${ALLOW_IMPERSONATION:-1}
      # пустая база: пароль администратора admin; DEMO_SEED=1 — демо-данные (пароль demo1234)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEMO_SEED: ${DEMO_SEED:-0}
      # за своим reverse-proxy (docker-compose.prod.yml) — 1, иначе 0
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-0}
      CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-0}
    volumes:
      - tt_data:/srv/timetrack/data
      - tt_templates:/srv/timetrack/templates   # фирменные бланки заявлений переживают пересборку
volumes:
  tt_data:
  tt_templates:
